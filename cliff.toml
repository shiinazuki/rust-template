# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# 仓库地址不再硬编码，由下面 body 里的 `repo_url` 按托管平台推导：
#   - GitHub：`--github-repo owner/repo` 或环境变量 `GITHUB_REPO`
#   - GitLab：`--gitlab-repo owner/repo` 或环境变量 `GITLAB_REPO`
# 两者 git-cliff 都会解析进 `remote.github.*` / `remote.gitlab.*`，未提供时是空串。
#   - 本地：`just changelog` 会自动识别 origin 的平台并注入对应的变量
#   - CI：GitHub 的 workflow 设 `GITHUB_REPO`，GitLab 的流水线设 `GITLAB_REPO`
#
# ⚠️ 自建 GitLab 的话，下面拼出来的 host 仍是 gitlab.com，按需改成你自己的域名。
#
# 分组名里的 `<!-- N -->` 是排序用的隐藏前缀：Tera 的 group_by 按字符串排序，
# 加上编号就能固定「Features 在 Bug Fixes 前面」这样的顺序，
# 渲染时由模板里的 `striptags` 过滤掉，不会出现在 CHANGELOG 里。

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file. See [conventional commits](https://www.conventionalcommits.org/) for commit guidelines.\n
"""
body = """
{% set_global repo_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo %}\
{% if remote.gitlab.owner %}{% set_global repo_url = "https://gitlab.com/" ~ remote.gitlab.owner ~ "/" ~ remote.gitlab.repo %}{% endif %}\
---
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repo_url }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message | trim | replace(from="<REPO>", to=repo_url) }} - ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }})) - {{ commit.author.name }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %} [**breaking**]{% endif %}\
                {{ commit.message | trim | replace(from="<REPO>", to=repo_url) }} - ([{{ commit.id | truncate(length=7, end="") }}]({{ repo_url }}/commit/{{ commit.id }})) - {{ commit.author.name }}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
# 去掉模板渲染产生的首尾空白
trim = true
# 即使这次没有新 release 也渲染 body（否则空仓库 / 无 tag 时输出是空的）
render_always = true
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/owner/repo" },
]

[git]
# 按 https://www.conventionalcommits.org 解析提交
conventional_commits = true
# 不符合 conventional commits 的提交也保留（归到 Other 组），
# 便于导入历史仓库；想强制规范可改成 true
filter_unconventional = false
# 要求所有提交都必须是 conventional，优先级高于 filter_unconventional
require_conventional = false
# 是否把提交信息的每一行当成独立提交处理
split_commits = false
# 预处理提交信息的正则
commit_preprocessors = [
  # 把 (#123) 变成 issue 链接。这里只能写死占位符 <REPO>（预处理阶段拿不到
  # 仓库地址），真正的地址在上面的 body 模板里用 Tera 的 replace 过滤器补上。
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# 解析并分组提交
commit_parsers = [
  { message = "^\\[skip", skip = true },
  { message = "^chore\\(version\\):", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  # 依赖升级由 dependabot 批量产生，写进 CHANGELOG 意义不大
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactoring" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^style", group = "<!-- 5 -->🎨 Style" },
  { message = "^test", group = "<!-- 6 -->🧪 Tests" },
  { body = ".*security", group = "<!-- 7 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
  { message = "^chore|^ci|^build", group = "<!-- 9 -->⚙️ Miscellaneous Chores" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# 防止 breaking change 被上面的 skip 规则误伤
protect_breaking_commits = true
# 丢弃没被任何 parser 匹配到的提交（上面最后一条 `.*` 已经兜底，这里保持 false）
filter_commits = false
# 出现无法匹配的提交时直接失败
fail_on_unmatched_commit = false
# 从提交信息里提取外部引用并转成链接
link_parsers = []
# 只统计当前分支上的 tag
use_branch_tags = false
# 匹配版本 tag 的正则
tag_pattern = "v[0-9].*"
# 需要跳过的 tag
skip_tags = ""
ignore_tags = ""
# 按拓扑顺序而不是时间顺序排列 release / 提交
topo_order = false
topo_order_commits = true
# 每个分组内提交的顺序：oldest / newest
sort_commits = "oldest"
# 是否递归处理 submodule 的提交
recurse_submodules = false

# 自动推断下一个版本号（`git cliff --bumped-version`，cargo-release 之外的备选方案）
[bump]
# feat 提交是否总是抬升 minor 版本（0.x 阶段默认只抬 patch）
features_always_bump_minor = false
# breaking change 是否总是抬升 major 版本（0.x 阶段默认只抬 minor）
breaking_always_bump_major = false
# 仓库还没有任何 tag 时，第一个版本用什么
initial_tag = "v0.1.0"
