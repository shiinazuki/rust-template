# typos 拼写检查配置：https://github.com/crate-ci/typos
# 本地：typos                    查看问题
#       typos --write-changes    自动修正

[default]
# 打开后英式拼写（Colour / Behaviour 等）也会被判错，默认不设
# locale = "en-us"

# 匹配到这些正则的内容不做拼写检查
extend-ignore-re = [
  # 24 个字符以上的 base64 / hex / 密钥 / 哈希
  "[A-Za-z0-9+/=_-]{24,}",
  # 行尾加 `// spellchecker:disable-line` 单独跳过某一行
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
]

# 放行的专有名词、缩写、人名，两边写同一个词
[default.extend-words]
# ba = "ba"

[files]
extend-exclude = [
  "CHANGELOG.md", # 由 git-cliff 生成
  "Cargo.lock",
  "target/",
  "vendors/",
  "*.svg",
  "*.lock",
  # 测试夹具 / 第三方数据文件按需追加，例如：
  # "fixtures/",
  # "assets/",
]
