# cargo-deny 配置：依赖的安全公告、License 合规、重复版本与来源审计。
#   本地：just audit   /   CI：cargo deny check
#
# 完整字段说明见 https://embarkstudios.github.io/cargo-deny/
# 本文件只保留常用项并按本模板的策略做了取舍，不是上游的全量模板。

# ---------------------------------------------------------------------------
# 依赖图的构建方式
# ---------------------------------------------------------------------------
[graph]
# 只检查这里列出的目标平台；留空（当前状态）表示检查所有平台的依赖。
#
# 留空更安全——任何平台上的漏洞都能查到——代价是噪音：Windows 专有的
# windows-sys / windows-targets 那一大坨几乎必然出现多版本共存。本模板把
# [bans] multiple-versions 设成了 "warn" 而不是 "deny"，所以这些噪音不会卡 CI，
# 留空是划算的。
#
# 什么时候该点名：把 multiple-versions 收紧成 "deny" 之后，或者项目明确只发布
# 给固定几个平台时。取消注释并按实际支持的平台增删即可。
targets = [
  # "x86_64-unknown-linux-gnu",
  # "aarch64-unknown-linux-gnu",
  # "aarch64-apple-darwin",
  # "x86_64-pc-windows-msvc",
]
all-features = false
no-default-features = false
# 不检查仅用于开发的依赖树（测试 / benchmark）。设为 true 可以大幅减少噪音，
# 但注意 dev-dependencies 的漏洞就不会被发现了。
exclude-dev = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# 安全公告（RustSec advisory-db）
# ---------------------------------------------------------------------------
[advisories]
# 忽略特定公告。务必写明 reason，方便下次复查。
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "只在 windows 上触发，本项目不支持 windows" },
  # { crate = "some-crate@0.1.1", reason = "上游还没发新版，已确认不走到受影响的代码路径" },
]

# 依赖被标记为「无人维护」时的处理级别：
#   all        - 所有依赖（含间接依赖），最严格但噪音也最大
#   workspace  - 只管本 workspace 直接依赖的（推荐：这些才是你换得掉的）
#   transitive - 只管间接依赖
#   none       - 关闭检查
unmaintained = "workspace"

# 用到已被 yank 的版本直接判失败——通常意味着 Cargo.lock 该更新了
yanked = "deny"

# 公告数据库超过这个时间没更新就报错，防止 CI 拿着几个月前的缓存"检查通过"。
# 离线构建环境请注释掉。
maximum-db-staleness = "P7D"

# ---------------------------------------------------------------------------
# License 合规
# ---------------------------------------------------------------------------
[licenses]
# 允许的 License（SPDX 标识符，见 https://spdx.org/licenses/）。
# 这里是一份对商业使用友好的宽松许可清单，刻意不包含 GPL / AGPL 这类传染性协议。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  # 注意这是 SPDX 里的 License 名，不是那个 C 库：ring（rustls 的默认后端）
  # 的 License 表达式里带 OpenSSL 这一项。允许它和「不引入 openssl C 依赖」
  # 并不矛盾——后者是靠下面 [bans] 的 deny 列表来管的。
  "OpenSSL",
]

# 从 License 文本反推 License 类型时的相似度阈值，0.8 是上游默认值。
# 调低会更宽松，但也更容易认错。
confidence-threshold = 0.8

# allow 里列了却没有任何依赖用到的 License 不再报 warning。
# 上面这份清单是"预置"的，项目早期绝大多数都用不上，否则满屏都是噪音。
unused-allowed-license = "allow"

# 只对单个 crate 放行的 License（比 allow 更克制）
exceptions = [
  # { allow = ["GPL-3.0"], crate = "some-gpl-crate" },
]

# 有些 crate 的 License 信息机器读不出来，可以在这里手工澄清
# [[licenses.clarify]]
# crate = "ring"
# expression = "MIT AND ISC AND OpenSSL"
# license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
# 本 workspace 里不发布的 crate（publish = false）是否跳过 License 检查
ignore = false
registries = []

# ---------------------------------------------------------------------------
# 依赖版本与特性禁令
# ---------------------------------------------------------------------------
[bans]
# 同一个 crate 出现多个版本：只警告不失败。依赖多了几乎必然出现，
# 想强制收敛可以改成 "deny" 并用下面的 skip / skip-tree 逐个豁免。
multiple-versions = "warn"

# 禁止 version = "*" 这种没有上界的依赖声明
wildcards = "deny"
# 但 path / git 依赖用 "*" 是正常写法，放行
allow-wildcard-paths = true

highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# 白名单：一旦非空，**只有**列出的 crate 被允许出现在依赖图里。慎用。
allow = []
# allow 是否也自动包含 workspace 成员
allow-workspace = false

# 明确禁止的 crate
deny = [
  # { crate = "openssl", reason = "统一用 rustls，不引入 C 依赖" },
  # 也可以只在被某个 crate 依赖时放行：
  # { crate = "ansi_term@0.11.0", wrappers = ["clap"] },
]

# 重复版本检查的豁免名单
skip = [
  # { crate = "windows-sys@0.52", reason = "上游依赖还没跟上" },
]
# 与 skip 类似，但会连同整棵子依赖树一起跳过
skip-tree = [
  # { crate = "some-crate@1.0", depth = 20 },
]

# ---------------------------------------------------------------------------
# 依赖来源
# ---------------------------------------------------------------------------
[sources]
# 来自未知 registry / git 仓库的依赖直接判失败：
# 供应链攻击最常见的入口就是一个看起来人畜无害的 git 依赖。
# 确实需要时，把地址加到下面的 allow-git / allow-org 里，并在 PR 里说明。
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # "https://github.com/some-org/some-crate",
]

[sources.allow-org]
# 整个组织下的 git 依赖都放行
github = []
gitlab = []
bitbucket = []
