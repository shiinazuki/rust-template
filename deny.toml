# cargo-deny 配置：安全公告、License、重复版本与依赖来源。运行：just audit
# 只写与默认值不同的项，完整字段见 https://embarkstudios.github.io/cargo-deny/

# 只检查这些平台的依赖（默认所有平台）
# [graph]
# targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

# ---------------------------------------------------------------------------
# 安全公告（RustSec advisory-db），用系统 git 拉取
# ---------------------------------------------------------------------------
[advisories]
# 忽略特定公告，逐条写明 reason
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "只在 windows 上触发，本项目不支持 windows" },
  # { crate = "some-crate@0.1.1", reason = "上游还没发新版，已确认不走到受影响的代码路径" },
]
# 只对直接依赖判「无人维护」失败（默认 all）
unmaintained = "workspace"
# 用到已被 yank 的版本时判失败（默认 warn）
yanked = "deny"
# 关闭公告库拉取（--offline / --frozen）时允许的最大陈旧程度（默认 90 天）
maximum-db-staleness = "P7D"

# ---------------------------------------------------------------------------
# License 合规
# ---------------------------------------------------------------------------
[licenses]
# 允许的 License（SPDX 标识符）：宽松许可，不含 GPL / AGPL 等传染性协议
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
]
# allow / exceptions 里列了却没被用到的 License 不报 warning
unused-allowed-license = "allow"
unused-license-exception = "allow"

# 只对单个 crate 放行的 License
exceptions = [
  # { allow = ["GPL-3.0"], crate = "some-gpl-crate" },
]

# 手工澄清机器读不出 License 信息的 crate
# [[licenses.clarify]]
# crate = "some-crate"
# expression = "MIT AND ISC"
# license-files = [{ path = "LICENSE", hash = 0x12345678 }]   # hash 以 cargo deny 报出的为准

# ---------------------------------------------------------------------------
# 依赖版本与特性禁令
# ---------------------------------------------------------------------------
[bans]
# 禁止 version = "*" 这种没有上界的依赖声明（默认 warn）
wildcards = "deny"
# path / git 依赖写 "*" 属正常写法，放行
allow-wildcard-paths = true
# 导出 dotgraph（`cargo deny check bans -g <dir>`）时只给最短的那条重复版本路径上色
highlight = "simplest-path"

# 明确禁止的 crate
deny = [
  # { crate = "openssl", reason = "统一用 rustls，不引入 C 依赖" },
  # 也可以只在被某个 crate 依赖时放行：
  # { crate = "ansi_term@0.11.0", wrappers = ["clap"] },
]

# 同一个 crate 出现多个版本时默认只警告；加上 multiple-versions = "deny" 后在这里逐个豁免
skip = [
  # { crate = "windows-sys@0.52", reason = "上游依赖还没跟上" },
]
# 连同整棵子依赖树一起豁免：
# skip-tree = [{ crate = "some-crate@1.0", depth = 20 }]

# 检查各成员是否用 `foo = { workspace = true }` 继承依赖版本
[bans.workspace-dependencies]
# path 依赖不参与重复声明检查
include-path-dependencies = false
# [workspace.dependencies] 里声明了却没人用时只警告（默认 deny），布局稳定后可删掉这行
unused = "warn"

# 扫描带 build script 或 proc-macro 的包里夹带的可执行文件与脚本（整段不写则不扫），
# 带 shebang 的脚本也判失败（默认只提示）
[bans.build]
interpreted = "deny"

# 预置放行：这几个常见依赖的包里带有上游的 CI / 测试脚本，只放行列出的文件。
# 没用到其中某个依赖时的 unmatched-bypass 警告由 `just audit` 的 -A 关掉。
[[bans.build.bypass]]
name = "libc"
allow-globs = ["etc/*.py"]

[[bans.build.bypass]]
name = "blake3"
allow-globs = [".github/workflows/*.py", "c/test.py"]

[[bans.build.bypass]]
name = "curve25519-dalek"
allow-globs = ["tests/build_tests.sh"]

# 撞上别的误报时在这里逐个放行：
# [[bans.build.bypass]]
# name = "some-crate"
# build-script = "<build.rs 的 sha256>"   # 内容一变校验和就对不上，会重新报警
# allow-globs = ["scripts/*.py"]
# allow = [{ path = "bin/x86_64-linux", checksum = "<sha256>" }]

# 直接依赖里有已被 std 取代的 crate（如 lazy_static -> LazyLock）时判失败，整段不写则不查
[bans.std-replacements]
# 给没声明 rust-version 的 crate 用的兜底版本，打开时要与 Cargo.toml 的 rust-version 一致
# rust-version = "1.94"

# 按 crate 禁用具体 feature
# [[bans.features]]
# name = "some-crate"
# version = "1.0"
# deny = ["openssl"]
# allow = ["rustls"]
# reason = "统一走 rustls，不引入 C 依赖"

# ---------------------------------------------------------------------------
# 依赖来源（默认只认 crates.io）
# ---------------------------------------------------------------------------
[sources]
# 未知 registry / git 来源判失败（默认 warn），需要时加进 allow-git 或 allow-org
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # "https://github.com/some-org/some-crate",
]
# allow-org 里列了却没被用到的组织不报 warning
unused-allowed-org = "allow"

# 整个组织下的 git 依赖都放行
# [sources.allow-org]
# github = ["some-org"]
