# 固定构建 / 测试 / clippy 使用的工具链版本。
# 进入目录时 rustup 会按这里的声明自动安装并切换，团队成员之间不会再出现
# "我这边能过 CI 你那边不过" 的版本漂移。
#
# ⚠️ 这个文件会覆盖你 rustup 的全局默认工具链：无论 `rustup default` 设的是什么，
#    在本项目目录内一律以这里的 channel 为准。
#
# channel 可选：
#   "stable"             跟随最新 stable（模板默认；绝大多数项目该用这个）
#   "nightly"            滚动更新的最新 nightly。
#                        ⚠️ 它每天都在变，某天的编译器 ICE、某个新增的 clippy lint
#                        都会让 CI 无缘无故变红，而这跟你的代码没有关系。
#                        选它只有一个正当理由：你确实要用 #![feature(...)]。
#   "nightly-2026-08-01" 钉死到某一天的 nightly：既能用 #![feature(...)]，
#                        又不会因为 nightly 每天变动导致 CI 莫名其妙挂掉。
#                        某个 nightly 缺少 rustfmt/clippy 组件时也靠它绕过。
#                        ⚠️ 撞上编译器 ICE 时这就是**第一救急手段**：往前退几天
#                        （`just ice` 会把该看的信息摘给你）。这是项目级决定——
#                        模板不替你钉死日期，因为那个日期会随时间腐烂。
#   "1.85.0"             完全锁死到某个具体版本
#
# ⚠️ 选 nightly 要知道一条差异：nightly-2026-08-06 起默认启用了新一代借用检查器
#    Polonius，它比 stable 的 NLL 接受更多合法程序（典型是「条件返回一个借用，
#    之后再可变借用同一个值」）。这个差异**没有任何显式标记**——没有属性、没有 lint、
#    连 warning 都没有，所以完全可能在 nightly 上写出一段 stable 编不过的代码而不自知。
#    模板的应对是 `just nll` / CI 的 msrv job：同一条 nightly 编译但换回 NLL
#    （`-Zpolonius=off`）就地拦下。Polonius 进 stable 后（官方计划 2026 年底）可删。
[toolchain]
channel = "{{ toolchain }}"
# profile = "minimal" 只装 rustc / cargo / rust-std，其余按需在这里点名：
#   rustfmt / clippy      格式化与 lint
#   rust-src              rust-analyzer 解析标准库所必需——缺了它编辑器里对 std
#                         没有补全和跳转，还会报 "can't find crate for core"
#   llvm-tools-preview    cargo-llvm-cov 生成覆盖率所必需。它和 `llvm-tools` 是同一份
#                         东西的新旧两个名字，但 `rustup component list --installed`
#                         只显示后者——`just doctor` 和 template-ci 因此按不带后缀的匹配。
components = ["rustfmt", "clippy", "rust-src", "llvm-tools-preview"]
profile = "minimal"

# 可选组件，按需加进上面的 components：
#   rust-analyzer   rustup 分发的 LSP 服务端。多数人用编辑器插件自带的那份就够了；
#                   只有在需要让 LSP 版本与工具链严格对齐（比如 nightly 专有语法
#                   导致插件版本解析不了）时才有必要加。加了之后要把编辑器指向
#                   `rustup run <channel> rust-analyzer`。
#   miri            检测未定义行为，跑 `cargo +nightly miri test`（仅 nightly）
#   rustc-dev       写 clippy / rustc 插件才需要

# 交叉编译目标。留空表示只装当前平台；要交叉编译时在这里点名，
# rustup 会连同标准库一起装好：
# targets = ["x86_64-unknown-linux-musl", "aarch64-apple-darwin"]

# ⚠️ channel 是滚动的 "nightly" 时，偶尔会碰上某天的 nightly 缺其中某个组件，
#    rustup 会直接拒绝安装整个工具链。真遇上了就把 channel 钉成前一天的日期版本。

# 关于格式化：rustfmt.toml 用了 imports_granularity、group_imports、wrap_comments 等
# unstable 选项，只有 nightly 的 rustfmt 认，stable 会静默忽略。所以格式化命令必须显式
# 点名工具链——但**不写死 `+nightly`**，而是从上面的 channel 推导：
#   channel = "nightly"              -> 用 nightly，等价于 `cargo fmt`
#   channel = "nightly-2026-08-18"   -> 用这条日期工具链本身，不去碰「最新 nightly」
#   channel = "stable" / "1.85.0"    -> 退回 nightly，需额外装一份 nightly 的 rustfmt：
#       rustup toolchain install nightly --allow-downgrade --profile minimal --component rustfmt
#     （`just install-tools` 会装，`just doctor` 会检查）
#
# 三处实现规则一致：justfile 顶部的 `fmt_toolchain` 变量、
# .github/workflows/{build,release}.yaml 的 "Resolve rustfmt toolchain" 步骤、
# .gitlab-ci.yml 的 lint job。
#
# ⚠️ 写死 `+nightly` 的后果：channel 一旦钉成日期版本，`+nightly` 指的是**另一条**
#    工具链，多半没装；就算装了，两个 rustfmt 版本的排版也可能不同，于是「本地 check
#    过、CI 挂」，且报错里完全看不出原因。用推导则改 channel 时不必动格式化命令。
