# 固定构建 / 测试 / clippy 使用的工具链版本。
# 进入目录时 rustup 会按这里的声明自动安装并切换，团队成员之间不会再出现
# "我这边能过 CI 你那边不过" 的版本漂移。
#
# ⚠️ 这个文件会覆盖你 rustup 的全局默认工具链：无论 `rustup default` 设的是什么，
#    在本项目目录内一律以这里的 channel 为准。
#
# channel 可选：
#   "nightly"            滚动更新的最新 nightly（本项目当前的选择方式）
#   "nightly-2026-08-01" 钉死到某一天的 nightly：能用 #![feature(...)]，
#                        又不会因为 nightly 每天变动导致 CI 莫名其妙挂掉。
#                        某个 nightly 缺少 rustfmt/clippy 组件时也靠它绕过。
#   "stable"             跟随最新 stable
#   "1.85.0"             完全锁死到某个具体版本
#
# ⚠️ 选 nightly 的话，有一条差异值得先知道：从 2026-08-04 起，nightly 默认启用了
#    新一代借用检查器 Polonius，它比 stable 的 NLL 接受更多合法程序（最典型的是
#    「条件返回一个借用，之后再可变借用同一个值」这类写法）。
#
#    麻烦的地方在于这个差异没有任何显式标记——不像 #![feature(...)] 一眼可见，
#    它没有属性、没有 lint、连 warning 都没有。所以在 nightly 上完全可能写出一段
#    stable 编不过的代码而毫无察觉。本模板的应对是 `just nll` / CI 的 msrv job：
#    用同一条 nightly 编译但把借用检查器换回 NLL（`-Zpolonius=off`），就地拦下。
#
#    钉日期版本时也要留意：nightly-2026-08-03 及更早用的还是 NLL，之后才是 Polonius。
#    官方计划 2026 年底把 Polonius 推进 stable，到那时上面这套兜底就可以删掉了。
[toolchain]
channel = "{{ toolchain }}"
# profile = "minimal" 只装 rustc / cargo / rust-std，其余按需在这里点名：
#   rustfmt / clippy      格式化与 lint
#   rust-src              rust-analyzer 解析标准库所必需——缺了它编辑器里对 std
#                         没有补全和跳转，还会报 "can't find crate for core"
#   llvm-tools-preview    cargo-llvm-cov 生成覆盖率所必需
components = ["rustfmt", "clippy", "rust-src", "llvm-tools-preview"]
profile = "minimal"

# 可选组件，按需加进上面的 components：
#   rust-analyzer   rustup 分发的 LSP 服务端。多数人用编辑器插件自带的那份就够了；
#                   只有在需要让 LSP 版本与工具链严格对齐（比如 nightly 专有语法
#                   导致插件版本解析不了）时才有必要加。加了之后要把编辑器指向
#                   `rustup run <channel> rust-analyzer`。
#   miri            检测未定义行为，跑 `cargo +nightly miri test`（仅 nightly）
#   rustc-dev       写 clippy / rustc 插件才需要

# 交叉编译目标。留空表示只装当前平台；要交叉编译时在这里点名，
# rustup 会连同标准库一起装好：
# targets = ["x86_64-unknown-linux-musl", "aarch64-apple-darwin"]

# ⚠️ channel 是滚动的 "nightly" 时，偶尔会碰上某天的 nightly 缺其中某个组件，
#    rustup 会直接拒绝安装整个工具链。真遇上了就把 channel 钉成前一天的日期版本。

# 关于格式化：
# rustfmt.toml 里用到了 imports_granularity、group_imports、wrap_comments 等
# unstable 选项，只有 nightly 的 rustfmt 才认，stable 会静默忽略它们。
# 所以 justfile / CI / pre-commit 里的格式化命令一律显式写成 `cargo +nightly fmt`：
#
#   - channel 是 nightly 时，+nightly 指向的就是同一个工具链，等价于 `cargo fmt`
#   - channel 是 stable 时，需要额外装一次 nightly 的 rustfmt：
#       rustup toolchain install nightly --profile minimal --component rustfmt
#
# 例外：如果把 channel 钉成了日期版本（nightly-2026-08-01），`+nightly` 指的是
# 另一个「最新 nightly」工具链，需要单独安装，或者把那些命令里的 +nightly 去掉。
