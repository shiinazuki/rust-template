# cargo-release 配置：https://github.com/crate-ci/cargo-release
#   just release [patch|minor|major]   预演，确认后用 just release-execute 执行
#
# 只写与默认值不同的项。执行时打 tag 并推送到 origin，CI 收到 tag 后创建 Release。

# 只允许在这些分支上发版
allow-branch = ["main", "master"]

# tag 与提交信息的格式，与 cliff.toml 的 tag_pattern = "v[0-9].*" 对应
tag-name = "v{{version}}"
tag-message = "chore(release): {{crate_name}} v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"

# 发版前更新 CHANGELOG 并纳入发版提交（justfile 的 _changelog-for）
pre-release-hook = ["just", "_changelog-for", "{{version}}"]

# 不在本地 cargo publish；GitHub 上由 release.yaml 的 crates-io job 发布
publish = false
