# cargo-release 配置：https://github.com/crate-ci/cargo-release
#   发布流程：just release            （默认 patch）
#             just release minor
#             just release major
#
# ⚠️ 这个文件里的 {{version}} 等是 cargo-release 的占位符，不是 cargo-generate 的，
#    所以在 cargo-generate.toml 的 exclude 列表里，生成项目时不做变量替换。

# 只允许在这些分支上发版，防止在临时分支上误操作
allow-branch = ["main", "master"]

# tag 与提交信息的格式，和 cliff.toml 的 tag_pattern = "v[0-9].*" 保持一致
tag-name = "v{{version}}"
tag-message = "chore(release): {{crate_name}} v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"

# 发版前用 git-cliff 把 CHANGELOG 更新到新版本号，改动会一并进入发版提交，
# 这样 tag 指向的那个 commit 里就已经带着完整的 CHANGELOG。
# 具体命令在 justfile 的 _changelog-for 配方里（需要注入 GITHUB_REPO）。
pre-release-hook = ["just", "_changelog-for", "{{version}}"]

# 打完 tag 后自动 push 提交和 tag，CI 收到 tag 后创建 GitHub Release
push = true
push-remote = "origin"

# ⚠️ 「发不发 crates.io」有**两个**开关，改一个漏一个是最常见的困惑来源：
#
#   1. 这里的 publish —— 控制本地 `just release-execute` 要不要顺手 cargo publish。
#      保持 false 是有意的：本地机器上的临时凭据、没推上去的提交、装了一半的工具链，
#      都不该有机会把包发出去。
#   2. CI 那侧 —— GitHub 的 .github/workflows/release.yaml 里有个 crates-io job，
#      由仓库变量 PUBLISH_TO_CRATES_IO=true 打开（Settings → Secrets and variables
#      → Actions → Variables）。它走 crates.io 的 Trusted Publishing（OIDC），
#      仓库里不存长期 token，是推荐路径。
#
# 也就是说：**要发布就打开第 2 个，别动第 1 个**。两个都开会发两次（第二次报
# "crate version already uploaded"）。另外确认 Cargo.toml 里没有 publish = false。
publish = false

# 发版前跑一次 `cargo publish --dry-run` 式的校验
verify = true

sign-commit = false
sign-tag = false
