# rustfmt 配置，只用 stable 选项，编辑器的保存时格式化与 `just fmt` 结果一致。
# 全部选项见 https://rust-lang.github.io/rustfmt/

# 格式化风格的版本
style_edition = "2024"
# 编辑器直接调用 rustfmt（不经过 cargo）时按这个 edition 解析
edition = "2024"

newline_style = "Unix"
use_field_init_shorthand = true # Foo { x } 而不是 Foo { x: x }
use_try_shorthand = true # ? 而不是 try!
