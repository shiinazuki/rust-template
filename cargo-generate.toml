# cargo-generate 模板配置：https://cargo-generate.github.io/cargo-generate/
#
#   cargo generate --git https://github.com/<owner>/rust-template --name my-app
#   cargo generate --git ... --name my-lib --lib      # 生成库项目
#
# 非交互生成时用 --define 指定下面的占位符，--silent 下必须给全。

[template]
# choices 的 { value, label } 写法需要 0.24
cargo_generate_version = ">=0.24.0"

# ---------------------------------------------------------------------------
# exclude：文件照常复制到生成项目，但不做 liquid 变量替换
# ignore ：文件根本不进入生成项目，见下面的 ignore 段
# 两者匹配的都是「去掉 .liquid 后缀之后」的路径。
# ---------------------------------------------------------------------------
exclude = [
  # --- 花括号属于别的模板语言，必须躲开 liquid ---------------------------
  "cliff.toml", # git-cliff 的 Tera 模板
  # Actions 的 ${{ ... }}（dependabot.yml 需要渲染，所以只排除 workflows）
  ".github/workflows/**",
  ".gitlab-ci.yml", # GitLab CI 的 $VARIABLE / 规则表达式
  "justfile", # just 自己的 {{ 变量 }} 插值
  "docker.just", # 同上，just 的插值
  "release.toml", # cargo-release 的 {{version}} / {{crate_name}}
  # 钩子里的 `{{ project-name }}` 要原样保留
  ".githooks/**",
  "README.md", # 模板仓库自己的说明文档
  "scripts/**", # 模板自测脚本，含 shell 的 ${...} 与 cargo-generate 参数
  "template.just", # 模板仓库自己的 just 配方

  # --- 二进制与非文本资源：被 liquid 处理会损坏 --------------------------
  # LICENSE-* 里的作者与年份需要渲染，不能加进来。
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.gif",
  "*.webp",
  "*.ico",
  "*.svg",
  "*.pdf",
  "*.woff",
  "*.woff2",
  "*.ttf",
  "*.otf",
  "*.zip",
  "*.gz",
  "*.xz",
  "*.tar",
  "*.bin",
  "*.wasm",
  "*.der",
  "*.pem",
  "*.p12",
  "*.jks",
  "assets/**",
  "fixtures/**",
  "tests/snapshots/**",
]

# 只属于模板仓库、不进入生成项目的文件
ignore = ["CHANGELOG.md", ".github/workflows/template-ci.yaml", "template.just", "scripts/"]

# README.md 是模板自己的说明，_README.md 是生成项目的 README，由 post-script 替换。
# 不能用 README.md.liquid：匹配发生在去掉 .liquid 后缀之后，会被 exclude 的 README.md 排除。

[hooks]
# 生成后整理 LICENSE、README 与 Cargo.lock，并打印下一步提示
post = ["post-script.rhai"]

# ---------------------------------------------------------------------------
# 占位符
#
# project-name / crate_name / authors 等是内置变量，不在这里定义：
# https://cargo-generate.github.io/cargo-generate/templates/builtin_placeholders.html
# 只有顶层 [placeholders] 定义的变量才能驱动下面的 [conditional.*]。
# ---------------------------------------------------------------------------

[placeholders.description]
type = "string"
prompt = "项目简介（写入 Cargo.toml 的 description）"
default = "A Rust project"

[placeholders.repo-owner]
type = "string"
prompt = "仓库所有者：GitHub / GitLab 的用户名或组织名（用于 repository 字段）"
default = "your-username"
# 兼容 GitHub 用户名与 GitLab 的 group/subgroup 路径
regex = "^[A-Za-z0-9][A-Za-z0-9._/-]{0,98}$"

# 仓库域名由 ci 选项推导：gitlab -> gitlab.com，其余 -> github.com

[placeholders.toolchain]
type = "string"
prompt = "Rust 工具链（写入 rust-toolchain.toml 的 channel）"
# label 只用于交互提示；default、--define 与模板渲染用的都是 value
choices = [
  { value = "stable", label = "stable（默认）" },
  { value = "nightly", label = "nightly（需要 #![feature(...)] 时选）" },
]
default = "stable"

[placeholders.license]
type = "string"
prompt = "选择开源协议"
choices = [
  { value = "MIT", label = "MIT" },
  { value = "Apache-2.0", label = "Apache-2.0" },
  { value = "MIT OR Apache-2.0", label = "MIT OR Apache-2.0（双协议，Rust 生态的常见做法）" },
]
default = "MIT"

[placeholders.ci]
type = "string"
prompt = "CI 平台"
choices = [
  { value = "github", label = "github（.github/：workflows + dependabot）" },
  { value = "gitlab", label = "gitlab（.gitlab-ci.yml）" },
  { value = "none", label = "none（不生成 CI 配置）" },
]
default = "github"

[placeholders.docker]
type = "bool"
prompt = "生成 Dockerfile（多阶段构建 + distroless 运行镜像）？"
default = false

[placeholders.async_runtime]
type = "bool"
prompt = "引入 tokio 异步运行时？（同时开启 clippy 的阻塞 API 禁令）"
default = false

# --- 源码骨架开关：关掉时对应文件不生成 ------------------------------------

[placeholders.error_handling]
type = "bool"
prompt = "生成错误处理骨架（库用 thiserror；应用再叠一层 anyhow）？"
default = true

[placeholders.logging]
type = "bool"
prompt = "生成日志 / 追踪骨架（tracing + RUST_LOG 过滤）？【仅 bin 项目生效】"
default = false

# ---------------------------------------------------------------------------
# 按 crate 类型裁剪源码骨架
# crate_type 是内置变量，由命令行的 --bin / --lib 决定，不传时默认 bin。
# ---------------------------------------------------------------------------

[conditional.'crate_type == "lib"']
# 库项目不生成可执行入口、Docker 与 telemetry
ignore = ["src/main.rs", "src/telemetry.rs", "Dockerfile", ".dockerignore", "docker.just"]

# ---------------------------------------------------------------------------
# 按 CI 平台裁剪
# ---------------------------------------------------------------------------

[conditional.'ci != "github"']
ignore = [".github"]

[conditional.'ci != "gitlab"']
ignore = [".gitlab-ci.yml"]

# ---------------------------------------------------------------------------
# 按功能开关裁剪
# ---------------------------------------------------------------------------

[conditional.'docker == false']
ignore = ["Dockerfile", ".dockerignore", "docker.just"]

[conditional.'logging == false']
ignore = ["src/telemetry.rs"]

[conditional.'error_handling == false']
ignore = ["src/error.rs"]
