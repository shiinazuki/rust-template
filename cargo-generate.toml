# cargo-generate 模板配置：https://cargo-generate.github.io/cargo-generate/
#
# 用法：
#   cargo generate --git https://github.com/<owner>/rust-template --name my-app
#   cargo generate --git ... --name my-lib --lib      # 生成库项目
#
# 交互式会依次询问：项目简介 / GitHub 用户名 / 工具链（nightly 或 stable）/ 开源协议。
# 非交互可以全部用 --define 指定，例如 --define toolchain=stable。
#
# --bin（默认）生成 src/main.rs，--lib 生成 src/lib.rs + tests/，
# 由下面的 [conditional.'crate_type == ...'] 控制。

[template]
# 用到了 0.23 才有的 array 类型占位符与 conditional 能力
cargo_generate_version = ">=0.23.0"

# 这些文件里的 {% %} / {{ }} 属于别的模板语言，会和 cargo-generate 的 liquid
# 引擎冲突，必须排除在变量替换之外（文件本身照常复制到生成的项目里）：
#   - cliff.toml：git-cliff 的 Tera 模板
#   - .github/**：GitHub Actions 的 ${{ ... }} 表达式
#   - justfile：just 自己的 {{ 变量 }} 插值
#   - release.toml：cargo-release 的 {{version}} / {{crate_name}} 占位符
#   - .pre-commit-config.yaml：钩子里用 `{{ project-name }}` 判断是不是模板仓库本身，
#     这段字面量必须原样保留，不能被替换成真实包名
#   - README.md：模板仓库自己的说明文档，里面全是占位符示例
exclude = [
  "cliff.toml",
  ".github/**",
  "justfile",
  "release.toml",
  ".pre-commit-config.yaml",
  "README.md",
]

# 只对模板仓库自己有意义、不该出现在生成项目里的文件
ignore = [
  "CHANGELOG.md",
]

# 关于两个 README：
#   README.md   模板仓库自己的说明（怎么用这个模板），在上面的 exclude 里，
#               生成后由 post-script 删掉
#   _README.md  生成项目要用的 README，正常做变量替换，post-script 把它改名成 README.md
#
# 为什么不用 cargo-generate 的 `README.md.liquid` 自动改名机制？因为 exclude / ignore
# 的匹配发生在 `.liquid` 后缀被去掉之后，`exclude = ["README.md"]` 会把
# `README.md.liquid` 一起排除掉，导致生成项目里的 README 全是没替换的占位符。

[hooks]
# 生成后收尾：整理 LICENSE 文件、把 _README.md 顶替成 README.md、打印下一步提示
post = ["post-script.rhai"]

[placeholders.description]
type = "string"
prompt = "项目简介（写入 Cargo.toml 的 description）"
default = "A Rust project"

[placeholders.gh-username]
type = "string"
prompt = "GitHub 用户名或组织名（用于 repository 字段）"
default = "your-github-username"
# 按 GitHub 的用户名规则校验：只能是字母 / 数字 / 连字符，最长 39 位。
# 输错了会当场重问，而不是生成一个指向 404 的 repository 链接。
regex = "^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"

[placeholders.toolchain]
type = "string"
prompt = "Rust 工具链（写入 rust-toolchain.toml 的 channel）"
choices = ["nightly", "stable"]
default = "nightly"

[placeholders.license]
type = "string"
prompt = "选择开源协议"
choices = ["MIT", "Apache-2.0", "MIT OR Apache-2.0"]
default = "MIT"

# --- 按 crate 类型裁剪源码骨架 -------------------------------------------
# crate_type 是 cargo-generate 的内置变量，由命令行的 --bin / --lib 决定，
# 不传时默认为 bin。

[conditional.'crate_type == "lib"']
ignore = ["src/main.rs"]

[conditional.'crate_type == "bin"']
# 二进制 crate 没有可供外部 use 的库目标，集成测试示例一起去掉
ignore = ["src/lib.rs", "tests/integration.rs"]
