# pre-commit 钩子：https://pre-commit.com
# 安装：just hooks   （等价于 pre-commit install --install-hooks）
# 手动全量跑一遍：pre-commit run --all-files
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
        # 注意：模板里所有 TOML 都遵守「liquid 标签只挂在注释行行尾」的写法
        # （见 Cargo.toml 顶部的说明），因此它们在模板仓库里同样是合法 TOML，
        # 这个钩子对两边都有效，不需要任何排除。
        #
        # 反例是单独占一行的裸 {%- if ... %}：那样写文件就成了非法 TOML，
        # 编辑器的 TOML 语言服务和这个钩子都会开始报错。
      - id: check-json
        # .vscode 与 .devcontainer 下是 JSONC（带注释），标准 JSON 解析器会报错
        exclude: ^(\.vscode|\.devcontainer)/
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      # Windows 上不能创建的文件名（aux / con / 带冒号等）。Linux 上提交没事，
      # Windows 协作者一 clone 就报错，而且很难猜到原因。
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # cliff.toml 依赖 conventional commits 来分组，这里做强制校验
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # 拼写检查。用官方 hook 而不是本地的 typos 命令，pre-commit 会自己装好对应版本，
  # 免去"没装 typos 就静默跳过"的问题。
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        # 上游默认是 args: [--write-changes, --force-exclude]。
        # 去掉 --write-changes：只做检查，改不改交给人决定。
        # 但必须把 --force-exclude 留着——pre-commit 是把文件名显式传给 typos 的，
        # 没有这个参数时 .typos.toml 里的 [files] extend-exclude（CHANGELOG.md、
        # Cargo.lock、*.svg 等）会被完全无视。
        args: [--force-exclude]

  # 下面的 cargo 类钩子都带一句 `grep -qF "{{ project-name }}" Cargo.toml && exit 0`：
  # 模板仓库自身的 Cargo.toml 里还是占位符，不是合法 crate，任何 cargo 命令都会报
  # "invalid character `{` in package name"。检测到占位符就跳过。
  # 生成出来的项目里占位符已被替换，这行 grep 永远不匹配，钩子照常执行。
  - repo: local
    hooks:
      # TOML 排版。用本地的 taplo 而不是第三方 pre-commit 镜像仓库：
      # 这个项目对第三方来源一向谨慎（action 全部 hash 钉死、cargo-deny 管依赖来源），
      # 为一个排版检查再引一个上游不划算。`just install-tools` 会装好它。
      #
      # ⚠️ 这条**不需要**下面那句模板仓库的跳过判断：模板自己的 TOML 也是 taplo 干净的
      #    （liquid 标签一律锚在注释行行尾，taplo 不会碰它们）。
      - id: taplo-fmt
        name: taplo fmt
        description: Check TOML formatting (见 .taplo.toml).
        entry: taplo fmt --check
        language: system
        files: \.toml$
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt (nightly, 见 rustfmt.toml).
        entry: bash -c 'grep -qF "{{ project-name }}" Cargo.toml && exit 0; cargo +nightly fmt --all -- --check'
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: bash -c 'grep -qF "{{ project-name }}" Cargo.toml && exit 0; cargo check --all-targets --all-features'
        language: system
        files: (\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources
        entry: bash -c 'grep -qF "{{ project-name }}" Cargo.toml && exit 0; cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: (\.rs|Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny check
        description: Check cargo dependencies
        entry: bash -c 'grep -qF "{{ project-name }}" Cargo.toml && exit 0; cargo deny check'
        language: system
        files: (Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
      # 全量测试比较慢，放到 pre-push 而不是每次 commit
      - id: cargo-test
        name: cargo test
        description: unit test for the project
        entry: bash -c 'grep -qF "{{ project-name }}" Cargo.toml && exit 0; cargo nextest run --all-targets --all-features'
        language: system
        files: \.rs$
        pass_filenames: false
        stages: [pre-push]
