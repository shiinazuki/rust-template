# cargo 的项目级配置：https://doc.rust-lang.org/cargo/reference/config.html
# 个人偏好写进 ~/.cargo/config.toml。优先级：环境变量 > 本文件 > ~/.cargo/config.toml
#
# 环境变量 RUSTFLAGS 会整体替换这里的 rustflags。在这里启用 rustflags 时，
# 同步项目里显式设了 RUSTFLAGS 的地方（搜 `RUSTFLAGS=`）。

[net]
# 网络请求的重试次数
retry = 5

# 走系统 git 而不是内置的 libgit2，私有 git 依赖需要 SSH 凭据或代理时打开
# git-fetch-with-cli = true

# ---------------------------------------------------------------------------
# 依赖解析
# ---------------------------------------------------------------------------
[resolver]
# 依赖版本要求的 rustc 比本项目 rust-version 新时，只在没有其它版本可选时才用它
# （allow = 不区分）。按目录生效，与 Cargo.toml 的 resolver 版本无关。
incompatible-rust-versions = "fallback"

# 把 Cargo.lock 放到别处，路径必须以 Cargo.lock 结尾（需要 cargo 1.97+）
# lockfile-path = "Cargo.lock"

# ---------------------------------------------------------------------------
# 按需打开的条目。同一个表只能出现一次，启用多个 [build] 段时要合并成一段。
# ---------------------------------------------------------------------------

# [build]
# # 本地包的编译警告按错误处理（cargo 1.97+），不受 RUSTFLAGS 影响；
# # 只想在 CI 上生效就在 CI 里设 CARGO_BUILD_WARNINGS=deny
# warnings = "deny"
#
# # 中间产物与最终产物分开存放（cargo 1.91+），target/ 下只留最终产物。
# # 可用 {workspace-root} / {cargo-cache-home} / {workspace-path-hash} 变量；
# # 改了要同步 `just clean` 与 CI 里写死 target/ 的路径。
# build-dir = "{cargo-cache-home}/build/{workspace-path-hash}"

# 用本机 CPU 的全部指令集编译，产物只能在同型号 CPU 上运行，别用于分发
# [build]
# rustflags = ["-C", "target-cpu=native"]

# 并行编译前端（仅 nightly），线程数超过 8 基本没有额外收益
# [build]
# rustflags = ["-Z", "threads=8"]

# 全局缓存的自动清理频率（默认 "1 day"）。CI 缓存 CARGO_HOME 时设成 "never"，
# 或设环境变量 CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never
# [cache]
# auto-clean-frequency = "never"

# 把配置拆成多份再合并（cargo 1.94+），路径相对本文件，只接受 .toml 结尾
# include = [{ path = "cargo-local.toml", optional = true }]

# 依赖里有「将来会变成硬错误」的用法时，提示 `cargo report future-incompatibilities`
# [future-incompat-report]
# frequency = "always"

# 按 target 配 rustdocflags（cargo 1.96+）
# [target.'cfg(all())']
# rustdocflags = ["-D", "warnings"]

# 把编译进度报给终端模拟器，显示在任务栏 / 标签页上（cargo 1.87+）
# [term]
# progress.term-integration = true

# 从镜像下载 crates.io 的包（校验和与 Cargo.lock 不受影响）；
# 启用后 cargo publish / owner / yank 要加 `--registry crates-io`
# [source.crates-io]
# replace-with = "mirror"
#
# [source.mirror]
# registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

# 给所有 cargo 子命令注入环境变量
# [env]
# RUST_BACKTRACE = "1"
# # relative = true：相对项目根目录（.cargo/ 所在的目录）解析成绝对路径
# FIXTURES_DIR = { value = "tests/fixtures", relative = true }

# ---------------------------------------------------------------------------
# 链接器：x86_64-unknown-linux-gnu 已默认使用 rust-lld，macOS 的系统 ld 已经够快，
# 下面是另外两个平台的换法
# ---------------------------------------------------------------------------

# [target.aarch64-unknown-linux-gnu]
# # 本机与 CI 镜像都要装有 mold；这一行同样受文件开头的 RUSTFLAGS 覆盖规则影响
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# [target.x86_64-pc-windows-msvc]
# # rust-lld.exe 随工具链分发，不用另装
# linker = "rust-lld.exe"
