name: Bug 报告
description: 程序行为和预期不符
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为
      placeholder: 执行 ... 之后本应 ...，实际却 ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现的步骤或代码片段。能复现的 bug 才修得动。
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`<程序名> --version` 的输出，或者 commit hash"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、架构、Rust 版本（`rustc -vV`）
      placeholder: "macOS 15.3 arm64 / rustc 1.85.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关日志或 backtrace（跑之前设 `RUST_BACKTRACE=1`）。会自动按代码块渲染，不用加反引号。
      render: shell
