name: 功能建议
description: 希望增加或改变某个能力
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述**问题**而不是你想好的方案——很多时候有更简单的解法。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它做法
      description: 包括「什么都不做」——如果现状可以接受，这也是一个答案。
