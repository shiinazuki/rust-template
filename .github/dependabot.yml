# 依赖自动升级：https://docs.github.com/code-security/dependabot
version: 2

updates:
  # Rust 依赖
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # 新版本发布满 7 天才提 PR
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      # 提交信息为 chore(deps): ...，CHANGELOG 会过滤掉
      prefix: "chore"
      include: scope
    groups:
      # 补丁 / 小版本升级合并成一个 PR
      minor-and-patch:
        update-types:
          - minor
          - patch

  # workflow 里用 commit hash 钉死的 action，连同 `# vX.Y.Z` 注释一起更新
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # 容器基础镜像，只在生成了 Dockerfile 时存在{% if docker and crate_type == "bin" %}
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: scope{% endif %}
