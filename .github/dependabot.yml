# 依赖自动升级：https://docs.github.com/code-security/dependabot
version: 2

updates:
  # Rust 依赖
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # 和 conventional commits 对齐，cliff.toml 里会把 chore(deps) 从 CHANGELOG 中过滤掉
      prefix: "chore"
      include: scope
    groups:
      # 补丁 / 小版本升级合并成一个 PR，避免每周被十几个 PR 淹没
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions 自身的版本。
  #
  # workflow 里的 action 全部用 commit hash 钉死（tag 是可变的，上游一旦被攻破，
  # 把 v3 指向恶意提交就能直接进你的 CI——2025 年 tj-actions 事件就是这么发生的）。
  # hash 的代价是「不会自动跟进上游修复」，所以这条 dependabot 规则不是可选项：
  # 它每周把 hash 连同后面的 `# vX.Y.Z` 注释一起更新。
  #
  # 补充两点（都是 2025-2026 的新情况，但都**不改变**上面的做法）：
  #   1. GitHub 推出了 immutable actions（发布后不可重打 tag）。它防的是「同一个 tag
  #      被换掉」，防不了「攻破的账号再发一个新版本」，所以官方文档至今仍写着
  #      「full-length commit SHA 是唯一能把 action 当成不可变发布来用的方式」。
  #   2. 自 2025-08 起，SHA 钉死可以在**组织 / 仓库策略**层面强制
  #      （Settings → Actions → Policies），比靠 review 拦要硬。个人仓库同样可设。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # 容器基础镜像（rust:1-slim-bookworm / distroless）那一段，只有生成了 Dockerfile
  # 的项目才有：仓库里没有 Dockerfile 却留着 docker ecosystem 的话，dependabot 每周
  # 都会报一次 `dependency_file_not_found: No Dockerfiles nor Kubernetes YAML found
  # in /`——代码一点问题没有，Actions 页面上却一直挂着一条失败记录。{% if docker and crate_type == "bin" %}
  #
  # 有了下面这段，Debian 出了 CVE 才会有人提醒你。
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
      include: scope{% endif %}
