name: audit

# 每天检查依赖的安全公告（push / PR 上由 build.yaml 的 deny job 检查）。
# 仓库 60 天没有提交时 GitHub 会停用定时 workflow，需要在 Actions 页面重新启用。
on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this the template repo itself?
        id: probe
        run: |
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::这是模板仓库本身，跳过依赖审计（生成出来的项目里会正常执行）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo tools
        if: steps.probe.outputs.skip == 'false'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-deny
      - name: Check advisories / licenses / bans / sources
        if: steps.probe.outputs.skip == 'false'
        run: just audit
