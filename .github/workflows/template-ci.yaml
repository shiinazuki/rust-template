name: template-ci

# 模板仓库自己的 CI：按矩阵生成项目，再逐个跑一遍完整检查。
# 本文件在 cargo-generate.toml 的 ignore 列表里，不会进入生成的项目。
#
# 模板仓库根目录跑不了 cargo，「改完模板还能不能生成出可用项目」只能靠真生成一次来验证。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 每周跑一次完整矩阵：上游的 clippy / rustfmt / 依赖都在变
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # 模板根目录的 rust-toolchain.toml 里 channel 还是占位符，在这个目录下跑任何
  # cargo/rustup 命令都会失败。RUSTUP_TOOLCHAIN 优先级高于 rust-toolchain.toml，
  # 用它绕过去；scripts/smoke.sh 会在真正生成项目前把这个变量解开。
  RUSTUP_TOOLCHAIN: stable

jobs:
  smoke:
    name: generate & check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 矩阵里有 toolchain=nightly 的组合，这里用 --allow-downgrade 一次性把
      # 组件装齐，免得后面 rustup 现装时撞上缺组件的 nightly。
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --allow-downgrade --profile minimal \
            --component rustfmt,clippy,rust-src,llvm-tools
      - name: Install tools
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          # cargo-deny 不能漏：smoke.sh 的依赖审计那一步由 `command -v cargo-deny`
          # 守卫，装不上就会静默跳过。
          tool: cargo-generate,cargo-nextest,cargo-deny,just,taplo-cli
      # PR / push 上跑默认矩阵（10 组）；定时任务与手动触发跑完整矩阵（19 组），
      # 并用 SMOKE_DOCKER=1 真正构建一次容器镜像。
      #
      # 写成显式分支而不是 `bash scripts/smoke.sh $MODE`：后者不加引号会触发
      # shellcheck 的 SC2086，而同一条流水线里的 actionlint 会调 shellcheck。
      - name: Run smoke matrix
        env:
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--full' || '' }}
          SMOKE_DOCKER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          if [ -n "$MODE" ]; then
            bash scripts/smoke.sh "$MODE"
          else
            bash scripts/smoke.sh
          fi

  # 模板仓库自身的文件卫生：
  #   taplo  —— 模板里十几个 TOML 必须同时是合法 TOML（即「liquid 标签只能锚在注释行行尾」）
  #   typos  —— 拼错的词会原样复制进每一个生成出来的项目
  hygiene:
    name: toml & spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: taplo-cli,typos
      - name: Check TOML format
        run: taplo fmt --check
      - name: Check spelling
        run: typos

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: zizmor
      # actionlint 不在 install-action 的支持列表里（Go 写的，crates.io 上没有同名包），
      # 这里自己取回官方预编译二进制、核对 sha256 再装。
      # 版本要手工升级：dependabot 管不到 run: 里的版本号，
      # 校验和取自 release 页的 actionlint_<版本>_checksums.txt。
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64) arch=arm64 sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "actionlint 没有 $(uname -m) 的预编译包"; exit 1 ;;
          esac
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$sha  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$tarball" actionlint
          actionlint --version
      - name: Audit GitHub Actions workflows
        run: zizmor --min-severity medium --no-progress .github/workflows
      # actionlint 查写法，zizmor 查安全，两者互补
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: shellcheck
      # .githooks/ 一并覆盖：它们会在每个使用者机器上执行
      - name: Check shell scripts
        run: shellcheck scripts/*.sh .githooks/*
