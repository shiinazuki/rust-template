name: template-ci

# 模板仓库自己的 CI（不进入生成项目）：按矩阵生成项目并逐个跑完整检查
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 每周跑一次完整矩阵
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # 模板根目录的 channel 是占位符，用 RUSTUP_TOOLCHAIN 覆盖；smoke.sh 进入生成项目前会解除它
  RUSTUP_TOOLCHAIN: stable

jobs:
  smoke:
    name: generate & check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --allow-downgrade：选组件齐全的最近一版 nightly
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,rust-src
          rustup toolchain install nightly --allow-downgrade --profile minimal \
            --component rustfmt,clippy,rust-src
      - name: Install tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-generate,cargo-nextest,cargo-deny,just,taplo-cli,typos
      # PR / push 跑默认矩阵；定时与手动触发跑完整矩阵并构建容器镜像
      - name: Run smoke matrix
        env:
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--full' || '' }}
          SMOKE_DOCKER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          if [ -n "$MODE" ]; then
            bash scripts/smoke.sh "$MODE"
          else
            bash scripts/smoke.sh
          fi

  # 模板文件本身的 TOML 格式与拼写（taplo 同时校验 liquid 标签没有破坏 TOML 语法）
  hygiene:
    name: toml & spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: taplo-cli,typos
      - name: Check TOML format
        run: taplo fmt --check
      - name: Check spelling
        run: typos

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: shellcheck
      - name: Check shell scripts
        run: shellcheck scripts/*.sh .githooks/*
