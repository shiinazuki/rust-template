name: template-ci

# 模板仓库**自己的** CI：按矩阵生成项目，再逐个跑一遍完整检查。
# 这个文件在 cargo-generate.toml 的 ignore 列表里，不会进入生成的项目。
#
# 为什么必须有它：模板仓库里跑不了 cargo（根目录的 rust-toolchain.toml 与
# Cargo.toml 里都是占位符），所以「改完模板还能不能生成出可用项目」这件事
# 完全没有其它办法验证。liquid 标签写错一个、conditional 漏一条、生成的代码
# 差一个空行过不了 fmt --check——这些都只有真生成一次才会暴露。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 每周跑一次完整矩阵：上游的 clippy / rustfmt / 依赖都在变，
  # 模板没动也可能某天就生成不出能过 CI 的项目了。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # ⚠️ 模板根目录的 rust-toolchain.toml 里 channel 是 `{{ toolchain }}`，不是合法
  #    工具链名，在这个目录下跑任何 cargo/rustup 命令都会失败。RUSTUP_TOOLCHAIN
  #    的优先级高于 rust-toolchain.toml，用它绕过去。
  #    （scripts/smoke.sh 会在真正生成项目前把这个变量解开，
  #      否则它会连生成项目声明的 channel 一起盖掉。）
  RUSTUP_TOOLCHAIN: stable

jobs:
  smoke:
    name: generate & check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # nightly 这条不只是给 `cargo +nightly fmt` 用的：矩阵里有 toolchain=nightly
      # 的组合，进到那种项目目录后 rustup 会照 rust-toolchain.toml 把 components
      # 补齐。在这里用 --allow-downgrade 一次性装好，rustup 后面就不必现装——
      # 否则碰上某天的 nightly 缺组件，它没有 --allow-downgrade 可用，会直接失败。
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --allow-downgrade --profile minimal \
            --component rustfmt,clippy,rust-src,llvm-tools
      - name: Install tools
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          # cargo-deny 不能漏：smoke.sh 的依赖审计那一步是 `command -v cargo-deny`
          # 守卫的，装不上就静默跳过——CI 绿着，但那项检查其实一次都没跑过。
          tool: cargo-generate,cargo-nextest,cargo-deny,just,taplo-cli
      # PR / push 上跑默认矩阵（10 组，够覆盖每个开关的开与关）；
      # 定时任务与手动触发跑完整矩阵（19 组：bin 的 3 个源码开关全排列 + lib +
      # nightly + 三种 CI 平台 + 协议），并顺带真正构建一次容器镜像
      # （SMOKE_DOCKER=1，见 scripts/smoke.sh 的第 14 项检查）。
      #
      # ⚠️ 这里刻意不写成 `bash scripts/smoke.sh $MODE`：不加引号是为了让空的 MODE
      #    展开成**零个**参数，但那恰好是 shellcheck 的 SC2086，而同一条流水线里的
      #    actionlint 会调 shellcheck 检查每段 run:，于是模板自己的 CI 会判自己红。
      #    显式分支既没有引号问题，也不必依赖 smoke.sh 去容忍空串参数。
      - name: Run smoke matrix
        env:
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--full' || '' }}
          SMOKE_DOCKER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          if [ -n "$MODE" ]; then
            bash scripts/smoke.sh "$MODE"
          else
            bash scripts/smoke.sh
          fi

  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"
      # 模板仓库里的 cargo 类钩子会因为 Cargo.toml 里还是占位符而自动跳过，
      # 剩下的（空白、行尾、TOML/JSON 语法、拼写、conventional commits）照常检查。
      #
      # ⚠️ pre-commit/action 上游已进入 maintenance-only（README 第一句就写着不再接受
      #    新功能，推荐改用 pre-commit.ci）。它照常能跑，只是不会再有新特性；
      #    真要换的话有两条路：接 pre-commit.ci（第三方服务，要授权仓库），
      #    或者退回三行 run：`pip install pre-commit` + `pre-commit run --all-files`。
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: zizmor
      # actionlint 不在 install-action 的支持列表里（它是 Go 写的，crates.io 上也没有
      # 同名包）。install-action 碰到不认识的工具会退回 cargo-binstall，这一步于是会以
      # `For crate actionlint: actionlint is not found` 失败——不是网络抖动，重试没用。
      # 官方发布的就是预编译二进制，这里自己取回来、核对 sha256 再装。
      #
      # ⚠️ 版本得手工升：dependabot 只认 `uses:` 里的 action，管不到 run: 里的版本号。
      #    升级时把版本与下面的 sha256 一起换掉，校验和取自 release 页的
      #    actionlint_<版本>_checksums.txt。
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64) arch=arm64 sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "actionlint 没有 $(uname -m) 的预编译包"; exit 1 ;;
          esac
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$sha  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$tarball" actionlint
          actionlint --version
      - name: Audit GitHub Actions workflows
        run: zizmor --min-severity medium --no-progress .github/workflows
      # actionlint 查的是「写法对不对」，和 zizmor 的「安不安全」互补，见 build.yaml 里的说明
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: shellcheck
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
