name: release

# 只有推 v* tag 时才跑。日常的检查在 build.yaml 里。
#
# 为什么和 build.yaml 分开：发布流程里不使用任何编译缓存。缓存是可以被写入的
# （同一仓库的分支 / PR 都能往里放东西），一旦发布产物是用缓存里的中间结果构建的，
# 「污染缓存」就等价于「污染 release 二进制」。分开之后这条路径直接不存在，
# 代价只是发版时多花几分钟从零编译——一次发版而已，值。
on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 先把 tag 指向的这个 commit 从零验证一遍。
  # 注意这和「分支 CI 曾经通过」不是一回事：tag 可能打在任何 commit 上。
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 顺便把「这仓库有没有 bin target」告诉下面的 binaries job。
    #
    # ⚠️ 不要图省事在 binaries 上直接写 `if: hashFiles('src/main.rs') != ''`：
    #    job 级的 `if:` 在 checkout **之前**求值，那时工作区是空的，hashFiles
    #    恒为空串，job 会被静默跳过——表现就是「发版跑完了，Release 页面上一个
    #    二进制都没有」，而且没有任何红色提示。必须先 checkout 再用 outputs 传递。
    outputs:
      is_bin: ${{ steps.probe.outputs.is_bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # 本文件会原样跟着进入生成项目，但它同时也躺在模板仓库里。模板仓库上打一个
      # v* tag 会把整条发版流程跑起来，然后在 `rustup toolchain install` 上以
      # 「`{{ toolchain }}` 不是合法工具链」这种莫名其妙的方式失败。
      # 这里提前拦下并说清楚原因——模板仓库本来也不该走这条发版路径。
      # （build.yaml / audit.yaml 那两条是「跳过」，这里是「报错」：定时与 push 触发
      #   是自动发生的，不该变红；而打 tag 是人主动做的，需要明确告诉他做错了。）
      - name: Refuse to release the template repo itself
        run: |
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            echo "::error::这是模板仓库本身（Cargo.toml 里还是 liquid 占位符），不能走发版流程。"
            echo "::error::模板仓库要发布新版本的话，用普通 tag（比如 template-v1.2.0）或 GitHub Release，不要用 v* 前缀。"
            exit 1
          fi
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      # rustfmt.toml 用到了 imports_granularity / group_imports 等 unstable 选项，
      # stable 的 rustfmt 会静默忽略它们，所以格式检查必须走 nightly 的 rustfmt。
      #
      # ⚠️ 但不能写死 `+nightly`：rust-toolchain.toml 的 channel 一旦钉成日期版本
      #    （nightly-2026-08-18），`+nightly` 指的是**另一条**「最新 nightly」工具链。
      #    那样 CI 用的 rustfmt 和本地 `just fmt` 用的就不是同一个版本，两者对同一份
      #    代码的排版可能不一致——表现出来就是「本地 check 过、CI 挂」，且毫无线索。
      #    所以这里按 channel 推导，规则和 justfile 的 fmt_toolchain 变量完全一致。
      - name: Resolve rustfmt toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          case "$channel" in
            # channel 本身就是 nightly（含日期版本）：rust-toolchain.toml 的 components
            # 里已经带了 rustfmt，用它自己即可，不要再装第二条 nightly 进来。
            nightly*)
              fmt="$channel"
              ;;
            # stable / 具体版本号：需要额外装一份 nightly 的 rustfmt。
            # --allow-downgrade：某天的 nightly 偶尔缺 rustfmt，让 rustup 自动退回到有的那天。
            *)
              fmt=nightly
              rustup toolchain install nightly --allow-downgrade --profile minimal --component rustfmt
              ;;
          esac
          echo "FMT_TOOLCHAIN=$fmt" >> "$GITHUB_ENV"
      - name: Install cargo tools
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest,cargo-deny,typos
      - name: Check code format
        run: cargo "+$FMT_TOOLCHAIN" fmt --all -- --check
      - name: Check spelling
        run: typos
      - name: Lint rust sources
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo nextest run --locked --all-targets --all-features
      - name: Run doc tests
        if: hashFiles('src/lib.rs') != ''
        run: cargo test --locked --doc --all-features
      - name: Check dependencies
        run: cargo deny check -A unmatched-bypass
      # tag 名和 Cargo.toml 里的版本必须一致，否则发出去的 v1.2.3 里装的是 1.2.2。
      # cargo-release 正常流程不会出这种错，手动打 tag 时很容易。
      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 Cargo.toml 里的版本 (v$version) 不一致"
            exit 1
          fi
          echo "版本一致：$TAG"
      - name: Probe repository layout
        id: probe
        run: |
          is_bin=$([ -f src/main.rs ] && echo true || echo false)
          echo "is_bin=$is_bin" >> "$GITHUB_OUTPUT"
          echo "bin=$is_bin"

  # 生成本次的变更说明并创建 GitHub Release
  github-release:
    name: github release
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 需要写权限
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff 需要完整历史才能算出版本区间
          persist-credentials: false
      - name: Generate a changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          # --offline: 只用 GITHUB_REPO 拼提交链接，不调 GitHub API（免 token、免限流）
          args: -vv --latest --strip header --offline
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          # 预发布版本（v1.2.3-rc.1）自动标记成 pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 跨平台编译二进制并挂到上面那个 Release 上（只有 bin 项目才有意义）。
  #
  # 用 taiki-e/upload-rust-binary-action：编译、打包（Unix 出 .tar.gz、Windows 出 .zip）、
  # 生成 sha256 校验和、上传，一步到位，比手写十几行 shell 稳。
  binaries:
    name: binary (${{ matrix.target }})
    # verify 必须列进 needs 才能读到它的 outputs——只靠 github-release 间接依赖不行
    needs: [verify, github-release]
    if: needs.verify.outputs.is_bin == 'true'
    permissions:
      contents: write # 往 Release 里传附件
      # 下面两项只有开了 provenance 签名（见本 job 末尾那一步）才用得上。
      # 权限是 job 级的，没法按 step 条件申请；多给的这两项本身不额外暴露什么：
      # id-token 换到的是一次性 OIDC 凭据，attestations 只能往本仓库写证明。
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl 的两个目标交给 cross 在容器里编，宿主机不用装交叉 linker。
          # musl 静态链接，产物扔进任何 Linux 发行版（包括 distroless / scratch）都能跑。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      # 二进制名 = 包名，从 Cargo.toml 里读。不要想当然地用仓库名：
      # 仓库改名、或者一个仓库里有多个 bin 时就对不上了。
      - name: Resolve binary name
        id: pkg
        shell: bash
        run: echo "name=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and upload
        id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ${{ steps.pkg.outputs.name }}
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          # 产物名带上 tag，用户把几个版本下载到一起也不会混
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
      # 构建来源证明（SLSA provenance）：由 GitHub 用一次性 OIDC 凭据在 Sigstore 上
      # 签一份「这个文件是本仓库的哪个 workflow、哪个 commit 构建出来的」，公开可验：
      #     gh attestation verify <下载到的压缩包> --repo <owner>/<repo>
      # 校验和只能回答「文件有没有被改过」，证明回答的是「它是谁造的」——
      # 攻击者能替换 Release 附件的话，把 .sha256 一起换掉是顺手的事。
      #
      # 默认**不启用**：仓库 Settings → Secrets and variables → Actions → Variables
      # 里加 ATTEST_BUILD_PROVENANCE=true 打开。要开关而不是直接开着，是因为
      # artifact attestation 对公开仓库随便用，私有 / internal 仓库则要 GitHub
      # Enterprise —— 直接开着会让一部分人的发版流程莫名其妙地红掉。
      #
      # tar 与 zip 只会有一个非空（Unix 出 .tar.gz，Windows 出 .zip），
      # `||` 取第一个非空值。
      - name: Attest build provenance
        if: vars.ATTEST_BUILD_PROVENANCE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  # 发布到 crates.io。默认**不启用**——要开的话在仓库
  # Settings → Secrets and variables → Actions → Variables 里加 PUBLISH_TO_CRATES_IO=true。
  #
  # ⚠️ 这是「发不发 crates.io」的**推荐**开关。release.toml 里还有一个同名的
  #    publish = false，那个管的是本地 `just release-execute` 要不要顺手发布——
  #    保持关闭即可，让发布只从 CI 这一条路走。两个都打开会发两次。
  #
  # 用的是 crates.io 的 Trusted Publishing（OIDC）：仓库里不存任何长期 token，
  # 由 GitHub 签发的一次性凭据换取 crates.io 的临时 token，泄漏面小得多。
  # 首次使用前要先在 crates.io 的 crate 设置页把「仓库 + workflow 文件名」登记为受信任发布者。
  crates-io:
    name: publish to crates.io
    if: vars.PUBLISH_TO_CRATES_IO == 'true'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # ⚠️ job 级 permissions 是**整体替换**，不是在顶层那份上追加：只要写了这一段，
      #    没列出来的 scope 一律变成 none。所以 contents: read 必须显式补上，
      #    否则 actions/checkout 在私有仓库上会直接 403。
      contents: read
      id-token: write # 换取 crates.io 临时 token 所必需
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
