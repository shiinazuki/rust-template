name: release

# 推 v* tag 时触发，不使用编译缓存
on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 从零验证 tag 指向的 commit
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 供 binaries job 的 if 判断
    outputs:
      is_bin: ${{ steps.probe.outputs.is_bin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to release the template repo itself
        run: |
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            echo "::error::这是模板仓库本身（Cargo.toml 里还是 liquid 占位符），不能走发版流程。"
            echo "::error::模板仓库要发布新版本的话，用普通 tag（比如 template-v1.2.0）或 GitHub Release，不要用 v* 前缀。"
            exit 1
          fi
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-nextest,cargo-deny,typos,taplo-cli
      - name: Lint, test and audit
        run: just ci
      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 Cargo.toml 里的版本 (v$version) 不一致"
            exit 1
          fi
          echo "版本一致：$TAG"
      - name: Probe repository layout
        id: probe
        run: |
          is_bin=$([ -f src/main.rs ] && echo true || echo false)
          echo "is_bin=$is_bin" >> "$GITHUB_OUTPUT"
          echo "bin=$is_bin"

  # bin 项目：跨平台编译并打包（Unix 为 .tar.gz，Windows 为 .zip），附 sha256，
  # 由 github-release job 统一发布；dry-run 只构建不上传
  binaries:
    name: binary (${{ matrix.target }})
    needs: [verify]
    if: needs.verify.outputs.is_bin == 'true'
    permissions:
      contents: read
      # 下面两项供 provenance 签名使用
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl 目标用 cross 编译，产物静态链接
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      # 二进制名 = 包名，从 Cargo.toml 里读，不用仓库名
      - name: Resolve binary name
        id: pkg
        shell: bash
        run: echo "name=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build and package
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ${{ steps.pkg.outputs.name }}
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          # 产物名带上 tag，多个版本下载到一起也不会混
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          dry-run: true
          dry-run-intended: true
      # 构建来源证明（SLSA provenance），验证：gh attestation verify <压缩包> --repo <owner>/<repo>
      # 仓库变量 ATTEST_BUILD_PROVENANCE=true 时启用（私有仓库需要 GitHub Enterprise）
      - name: Attest build provenance
        if: vars.ATTEST_BUILD_PROVENANCE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.tar || steps.build.outputs.zip }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.tar || steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 7

  # 生成变更说明，连同全部二进制一次性创建 Release（兼容 immutable releases）
  github-release:
    name: github release
    needs: [verify, binaries]
    # lib 项目的 binaries 是 skipped，照样要发 Release
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 需要写权限
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff 需要完整历史才能算出版本区间
          persist-credentials: false
      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          # --offline: 只用 GITHUB_REPO 拼提交链接，不调 GitHub API
          args: -vv --latest --strip header --offline
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Download build artifacts
        if: needs.verify.outputs.is_bin == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          flags=()
          # 预发布版本（v1.2.3-rc.1）自动标记成 pre-release
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file CHANGES.md "${flags[@]}" "${assets[@]}"

  # 发布到 crates.io，仓库变量 PUBLISH_TO_CRATES_IO=true 时启用（release.toml 的 publish 保持关闭）。
  # 走 Trusted Publishing：首次使用前在 crates.io 的 crate 设置页登记本仓库与 workflow 文件名。
  crates-io:
    name: publish to crates.io
    if: vars.PUBLISH_TO_CRATES_IO == 'true'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # job 级 permissions 整体替换顶层设置，contents: read 要显式写出
      contents: read
      id-token: write # 换取 crates.io 临时 token 所必需
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
