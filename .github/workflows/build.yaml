name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许在 Actions 页面手动触发

# 同一分支/PR 连续推送时取消上一次尚未跑完的 run（tag 触发的发布流程不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只给读权限；确实需要写的 job 在自己身上单独申明（最小权限原则）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，增量编译只会拖慢速度并撑大缓存体积
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快，PR 上第一时间给反馈
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      # rustfmt.toml 用到了 imports_granularity / group_imports 等 unstable 选项，
      # stable 的 rustfmt 会静默忽略它们，所以格式检查必须走 nightly。
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: typos
      - uses: Swatinem/rust-cache@v2
      - name: Check code format
        run: cargo +nightly fmt --all -- --check
      - name: Check spelling
        run: typos
      - name: Lint rust sources
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features --document-private-items

  # 测试 + 覆盖率
  test:
    name: test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        # 需要多平台验证时改成：
        # platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    # services:
    #   postgres:
    #     image: postgres:18
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v3
      - name: Check the package for errors
        run: cargo check --locked --all-targets --all-features
      # 用 .config/nextest.toml 里的 ci profile：不 fail-fast、失败重试 2 次、输出 JUnit
      - name: Execute rust tests with coverage
        run: cargo llvm-cov nextest --locked --profile ci --all-features --lcov --output-path lcov.info
      # nextest 不跑 doctest，有 lib target 时补一次
      - name: Execute doc tests
        if: hashFiles('src/lib.rs') != ''
        run: cargo test --locked --doc --all-features
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: lcov.info
          retention-days: 14
      - name: Upload test results
        if: always() # 测试失败时更需要这份报告
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.platform }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      # 需要 codecov 的话打开这一步，并在仓库 Secrets 里配置 CODECOV_TOKEN
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v7
      #   with:
      #     files: lcov.info
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # 依赖审计：不需要编译，几秒钟就能出结果，和上面的 job 并行跑
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependencies (advisories / licenses / bans / sources)
        run: cargo deny check

  # 验证 Cargo.toml 里声明的 MSRV 确实能编译，避免用了新版本才有的 API 却没改 rust-version。
  #
  # 项目跑在 nightly 上时自动跳过：nightly 项目可能用 #![feature(...)]，
  # 这类代码在任何 stable 上都编不过（E0554），MSRV 检查没有意义。
  # 判断依据是 rust-toolchain.toml 里的 channel，所以以后换工具链不用再改这里。
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve MSRV
        id: msrv
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${channel#nightly}" != "$channel" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "工具链是 ${channel}，跳过 MSRV 检查"
          elif [ -z "$version" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml 里没有 rust-version，跳过 MSRV 检查"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "MSRV = $version"
          fi
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        if: steps.msrv.outputs.skip == 'false'
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.msrv.outputs.skip == 'false'
      - name: Check with MSRV toolchain
        if: steps.msrv.outputs.skip == 'false'
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets --all-features

  # 特性组合检查：只跑 `--all-features` 会漏掉「单独开启某个 feature 编不过」这类问题，
  # 而使用者恰恰可能只开其中一个。cargo-hack 把 [features] 的幂集逐个 check 一遍。
  #
  # 现在模板没有声明任何 feature，这个 job 相当于一次普通 check（几秒钟）；
  # 等你往 Cargo.toml 里加 [features] 之后它才真正开始发挥作用，无需再改 CI。
  hack:
    name: feature powerset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      # --depth 2 限制组合爆炸：feature 一多，完整幂集是 2^n 个组合，CI 会跑到天荒地老
      - name: Check feature powerset
        run: cargo hack --locked --feature-powerset --depth 2 --no-dev-deps check

  # Miri：在解释器里跑测试，检测未定义行为（越界、悬垂指针、数据竞争、对齐错误）。
  # 仅 nightly 可用，所以工具链是 stable 时整个 job 自动跳过。
  #
  # 本模板默认 `unsafe_code = "forbid"`，你自己的代码里跑不出 UB；
  # 它的价值在于依赖里的 unsafe 也会被一并检查到。
  #
  # ⚠️ Miri 比原生慢一到两个数量级，且不支持大多数 FFI / 系统调用。
  #    项目一旦引入 C 依赖或做真实 IO，这个 job 会失败——那时直接删掉它即可。
  miri:
    name: miri (nightly only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 判断依据和 msrv job 一致：读 rust-toolchain.toml 的 channel，
      # 以后换工具链不用再改这里。
      - name: Is this a nightly project?
        id: check
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${channel#nightly}" != "$channel" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "工具链是 ${channel}，Miri 仅 nightly 可用，跳过"
          fi
      # 装的是「最新可用 miri 的那个 nightly」而不是今天的 nightly：
      # miri 组件偶尔会在某天的 nightly 里缺席，rustup 的这个别名能自动避开。
      - name: Install nightly with miri
        if: steps.check.outputs.skip == 'false'
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup
      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.skip == 'false'
      - name: Run tests under Miri
        if: steps.check.outputs.skip == 'false'
        env:
          # -Zmiri-disable-isolation: 允许测试读时钟 / 环境变量，否则很多测试直接报错
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --locked --all-features

  # 打了 v* tag 才跑：生成 changelog 并创建 GitHub Release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, deny, hack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 Release 需要写权限
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff 需要完整历史才能算出版本区间
          submodules: recursive
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          # --offline: 只用 GITHUB_REPO 拼提交链接，不调 GitHub API（免 token、免限流）
          args: -vv --latest --strip header --offline
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          # 预发布版本（v1.2.3-rc.1）自动标记成 pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 需要附带编译好的二进制时，在上面加一个 build job 产出 artifact，
          # 下载后用 files: 挂上来
          # files: dist/*
