name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许在 Actions 页面手动触发

# push / PR 上的检查，发布流程在 release.yaml 里。
#
# 同一 PR 连续推送时取消上一次未跑完的 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只给读权限，需要写的 job 在自己身上单独申明
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，关掉增量编译
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 探测仓库布局，供后面 job 级的 `if:` 使用（job 级 if 在 checkout 前求值，用不了 hashFiles）
  detect:
    name: detect targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_template: ${{ steps.probe.outputs.is_template }}
      is_lib_only: ${{ steps.probe.outputs.is_lib_only }}
      has_docker: ${{ steps.probe.outputs.has_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe repository layout
        id: probe
        run: |
          # 模板仓库本身（Cargo.toml 含 liquid 标签）跳过所有 cargo 相关的 job
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            is_template=true
          else
            is_template=false
          fi
          # 纯库项目（bin 项目也有 src/lib.rs）
          if [ -f src/lib.rs ] && [ ! -f src/main.rs ]; then
            is_lib_only=true
          else
            is_lib_only=false
          fi
          has_docker=$([ -f Dockerfile ] && echo true || echo false)
          {
            echo "is_template=$is_template"
            echo "is_lib_only=$is_lib_only"
            echo "has_docker=$has_docker"
          } >> "$GITHUB_OUTPUT"
          echo "template=$is_template lib_only=$is_lib_only docker=$has_docker"
          if [ "$is_template" = true ]; then
            echo "::notice::检测到这是模板仓库本身（Cargo.toml 里还是 liquid 占位符），跳过所有 cargo 相关的 job。模板自身的检查见 template-ci.yaml。"
          fi

  # 下面各 job 调用 justfile 里的同名配方，CI 环境下 cargo 命令自动带 --locked

  # 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快
  lint:
    name: lint
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,typos,taplo-cli
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint
        run: just lint

  # 测试 + 覆盖率
  test:
    name: test (${{ matrix.platform }})
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        # 需要多平台测试时换成下面这行
        # platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    # services:
    #   postgres:
    #     image: postgres:18
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v3
      # ci profile 见 .config/nextest.toml：不 fail-fast、失败重试、输出 JUnit
      - name: Run tests with coverage
        env:
          NEXTEST_PROFILE: ci
        run: just coverage doctest
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: lcov.info
          retention-days: 14
      - name: Upload test results
        if: always() # 测试失败时更需要这份报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.platform }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      # 需要 codecov 的话打开这一步，并在仓库 Secrets 里配置 CODECOV_TOKEN
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      #   with:
      #     files: lcov.info
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # 依赖审计：不需要编译，和上面的 job 并行跑
  deny:
    name: cargo-deny
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-deny
      - name: Check dependencies (advisories / licenses / bans / sources)
        run: just audit

  # stable 项目按 rust-version 编译，nightly 项目改用 NLL 借用检查器编译
  msrv:
    name: msrv / nll
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install just
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check MSRV / NLL
        run: just msrv

  # 逐个检查 feature 组合，没声明 feature 时跳过
  hack:
    name: feature powerset
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check feature powerset
        run: just hack

  # 纯库项目：以上一个 v* tag 为基线检查公开 API 的破坏性变更
  semver:
    name: semver-checks
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.is_lib_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 需要完整历史才能找到上一个 tag
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check for API breakage
        run: just semver

  # 纯库项目：直接依赖取约束允许的最低版本编译 lib
  minimal-versions:
    name: minimal versions
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.is_lib_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install just
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check minimal versions
        run: just minimal-versions

  # 有 Dockerfile 时构建镜像，不推送（CI 上 cache mount 为空，依赖从零编译）
  docker:
    name: docker build
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 表达式经 env 传入，不直接拼进 run
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
          REVISION: ${{ github.sha }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          docker build \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$REVISION" \
            -t ci-build-check:latest \
            .
