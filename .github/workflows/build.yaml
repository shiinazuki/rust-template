name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

# 同一分支/PR 连续推送时取消上一次尚未跑完的 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        # 需要多平台验证时改成：
        # platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # services:
    #   postgres:
    #     image: postgres:14.5
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     # Set health checks to wait until postgres has started
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      # rustfmt.toml 用到了 imports_granularity / group_imports 等 unstable 选项，
      # stable 的 rustfmt 会静默忽略它们，所以格式检查必须走 nightly。
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,typos
      - uses: Swatinem/rust-cache@v2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v3
      - name: Check code format
        run: cargo +nightly fmt --all -- --check
      - name: Check spelling
        run: typos
      - name: Check the package for errors
        run: cargo check --all-targets --all-features
      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check dependencies (advisories / licenses / bans / sources)
        run: cargo deny check
      - name: Execute rust tests with coverage
        run: cargo llvm-cov nextest --all-features --lcov --output-path lcov.info
      - name: Execute doc tests
        if: hashFiles('src/lib.rs') != ''
        run: cargo test --doc --all-features
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}
          path: lcov.info
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        with:
          config: cliff.toml
          # --offline: 只用 GITHUB_REPO 拼提交链接，不调 GitHub API（免 token、免限流）
          args: -vv --latest --strip header --offline
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.git-cliff.outputs.content }}
