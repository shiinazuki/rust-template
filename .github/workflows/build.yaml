name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许在 Actions 页面手动触发

# 本文件只负责 push / PR 上的持续检查，发布流程在 release.yaml 里。
# 分开是为了让缓存只服务于 CI，发布流程从零构建。
#
# 同一分支/PR 连续推送时取消上一次尚未跑完的 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认只给读权限，需要写的 job 在自己身上单独申明
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，关掉增量编译
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 探测仓库里有哪些 target，供后面的 job 做条件判断。
  #
  # 单独开一个 job 是因为 job 级的 `if:` 在 checkout 之前求值，那时
  # `hashFiles('src/lib.rs')` 恒为空串；先 checkout 再用 outputs 传结论才可靠。
  # （步骤级的 `if: hashFiles(...)` 没有这个问题。）
  detect:
    name: detect targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_template: ${{ steps.probe.outputs.is_template }}
      is_lib_only: ${{ steps.probe.outputs.is_lib_only }}
      has_docker: ${{ steps.probe.outputs.has_docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe repository layout
        id: probe
        run: |
          # 判断这里是不是模板仓库本身：模板仓库的 Cargo.toml 还是 liquid 占位符，
          # 任何 cargo 命令都会失败，所以下面所有 cargo 相关的 job 都跳过。
          # 模板自身的检查见 template-ci.yaml。
          if grep -q '{%' Cargo.toml 2>/dev/null; then
            is_template=true
          else
            is_template=false
          fi
          # 是 is_lib_only 而不是 is_lib：bin 项目也有 src/lib.rs，但那是内部库，
          # 不对外承诺 API，不跑 semver 检查。
          if [ -f src/lib.rs ] && [ ! -f src/main.rs ]; then
            is_lib_only=true
          else
            is_lib_only=false
          fi
          has_docker=$([ -f Dockerfile ] && echo true || echo false)
          {
            echo "is_template=$is_template"
            echo "is_lib_only=$is_lib_only"
            echo "has_docker=$has_docker"
          } >> "$GITHUB_OUTPUT"
          echo "template=$is_template lib_only=$is_lib_only docker=$has_docker"
          if [ "$is_template" = true ]; then
            echo "::notice::检测到这是模板仓库本身（Cargo.toml 里还是 liquid 占位符），跳过所有 cargo 相关的 job。模板自身的检查见 template-ci.yaml。"
          fi

  # 下面各 job 调用 justfile 里的同名配方，检查规则只在 justfile 里维护。
  # CI 环境里 justfile 会给 cargo 命令自动加上 --locked。

  # 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快
  lint:
    name: lint
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 后续步骤不需要推东西回仓库，不保留凭据
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,typos,taplo-cli
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint
        run: just lint

  # 测试 + 覆盖率
  test:
    name: test (${{ matrix.platform }})
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        # 默认只跑一个平台；代码碰了路径分隔符、换行、文件权限、进程 API 或 FFI 时，
        # 把下面这行放开跑多平台。
        # platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    # services:
    #   postgres:
    #     image: postgres:18
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v3
      # 这里没有单独的 `cargo check`：lint job 的 clippy 已是它的超集。
      # 只测 debug；要提前拦 release-only 的编译错误，补一条
      # `cargo check --locked --release --all-targets --all-features`。
      #
      # NEXTEST_PROFILE=ci 用 .config/nextest.toml 里的 ci profile：不 fail-fast、失败重试、输出 JUnit
      - name: Run tests with coverage
        env:
          NEXTEST_PROFILE: ci
        run: just coverage doctest
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: lcov.info
          retention-days: 14
      - name: Upload test results
        if: always() # 测试失败时更需要这份报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.platform }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      # 需要 codecov 的话打开这一步，并在仓库 Secrets 里配置 CODECOV_TOKEN
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      #   with:
      #     files: lcov.info
      #     token: ${{ secrets.CODECOV_TOKEN }}

  # 依赖审计：不需要编译，和上面的 job 并行跑
  deny:
    name: cargo-deny
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-deny
      - name: Check dependencies (advisories / licenses / bans / sources)
        run: just audit

  # stable 项目用 Cargo.toml 里声明的 rust-version 编一遍；nightly 项目改用
  # `-Zpolonius=off` 换回 stable 的 NLL 借用检查器编一遍。分支判断在 msrv 配方里。
  msrv:
    name: msrv / nll
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install just
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check MSRV / NLL
        run: just msrv

  # 特性组合检查：把 [features] 的幂集逐个 check 一遍，
  # 覆盖「只开某一个 feature 编不过」这类问题。没声明 feature 时配方直接跳过。
  hack:
    name: feature powerset
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-hack
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check feature powerset
        run: just hack

  # 公开 API 的破坏性变更检查（只对纯库项目跑，判断见 detect job）。
  # 以上一个 v* tag 为基线，指出该抬 minor 还是 major；没有 tag 时配方直接跳过。
  semver:
    name: semver-checks
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.is_lib_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 需要完整历史才能找到上一个 tag
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check for API breakage
        run: just semver

  # 依赖版本下限检查（只对纯库项目跑）：直接依赖取 Cargo.toml 允许的最低版本再编译 lib，
  # 防止下游用户解析到的旧版本缺少本库用到的 API。
  minimal-versions:
    name: minimal versions
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.is_lib_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (版本由 rust-toolchain.toml 固定)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install just
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check minimal versions
        run: just minimal-versions

  # 容器镜像构建验证（只在生成项目时选了 Docker 才有这个 job）：只构建、不推送，
  # 用来发现 Dockerfile 什么时候坏掉。
  # CI 上 BuildKit 的 cache mount 恒为空，每次都从零编译依赖；提速方案见 Dockerfile 顶部。
  docker:
    name: docker build
    needs: [detect]
    if: needs.detect.outputs.is_template != 'true' && needs.detect.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 走 env 而不是把 ${{ }} 直接拼进 run，防脚本注入
      - name: Build image
        env:
          DOCKER_BUILDKIT: "1"
          REVISION: ${{ github.sha }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          docker build \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$REVISION" \
            -t ci-build-check:latest \
            .
