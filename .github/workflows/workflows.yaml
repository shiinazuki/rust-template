name: workflows

# workflow 与 dependabot 配置的静态检查，只在它们有改动时触发。两个工具互补：
#   zizmor      安全向——脚本注入、过宽权限、缓存投毒、可变 tag、dependabot 冷却期
#   actionlint  正确性向——表达式、job 依赖、runner 标签、run: 里的 shell 语法
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: zizmor
      # 下载官方预编译二进制并校验 sha256。版本需手工升级，
      # 校验和取自 release 页的 actionlint_<版本>_checksums.txt。
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64) arch=arm64 sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "actionlint 没有 $(uname -m) 的预编译包"; exit 1 ;;
          esac
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "$sha  $tarball" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$tarball" actionlint
          actionlint --version
      # 只报中危及以上；更严可去掉该参数或加 --persona=pedantic
      - name: Audit GitHub Actions workflows and dependabot
        run: zizmor --min-severity medium --no-progress .github
      - name: Lint GitHub Actions workflows
        run: actionlint -color
