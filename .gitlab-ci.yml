# GitLab CI —— 与 .github/workflows/ 等价的一套流水线。
# 生成项目时选 `ci = gitlab` 才会保留本文件（选 github 则保留 .github/）。
#
# 结构：lint / test / deny / hack / msrv / semver 并行，各自调用 justfile 里的同名配方；
#       打 v* tag 时额外跑 release（先从零验证一遍，再建 Release）。

stages:
  - check
  - release

default:
  # 官方 rust 镜像作底，真正的版本由仓库里的 rust-toolchain.toml 决定。
  # trixie = Debian 13。
  image: rust:1-slim-trixie
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，关掉增量编译
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # GitLab 只能缓存工程目录下的路径，所以把 CARGO_HOME 挪进来。
  # 不叫 `.cargo`：那是项目级 cargo 配置目录的名字，会被缓存覆盖掉。
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # 关掉 cargo 的全局缓存自动 GC，避免它把刚恢复的缓存内容删掉
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  GIT_SUBMODULE_STRATEGY: recursive

# 两份缓存，key 不同，互不牵连：
#   - 工具（cargo-nextest 等）几乎不变，用固定 key；
#   - 编译产物跟着 Cargo.lock 走。
#
# 以 `.` 开头的是 GitLab 的隐藏 job，只作模板用，不会被调度执行。
.cargo-cache:
  cache:
    - key: cargo-tools-v1
      paths:
        - .cargo-home/bin/
    - key:
        files:
          - Cargo.lock
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - .cargo-home/git/db/
        - target/
      policy: pull-push

# 各 job 共用的准备动作，其中 install_tools 的策略是
# 「缓存里有就跳过，没有就用 cargo-binstall 下预编译二进制」。
.rust-setup:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
    # 按 rust-toolchain.toml 装好 channel 与 components
    - rustup show active-toolchain || rustup toolchain install
    - rustc --version && cargo --version
    - |
      install_tools() {
        missing=""
        for crate in "$@"; do
          # 少数 crate 的二进制名和包名不一致，这里做个映射
          case "$crate" in
            typos-cli) bin=typos ;;
            taplo-cli) bin=taplo ;;
            *)         bin="$crate" ;;
          esac
          command -v "$bin" >/dev/null 2>&1 || missing="$missing $crate"
        done
        if [ -z "$missing" ]; then
          echo "所需工具都在缓存里，跳过安装"
          return 0
        fi
        echo "需要安装:$missing"
        # cargo-binstall 只在第一条流水线上编译一次，之后从 .cargo-home/bin 缓存里来
        command -v cargo-binstall >/dev/null 2>&1 || cargo install --locked cargo-binstall
        # shellcheck disable=SC2086
        cargo binstall --no-confirm --locked $missing
      }

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# 下面各 job 调用 justfile 里的同名配方，检查规则只在 justfile 里维护。
# GitLab 会设 CI=true，justfile 据此给 cargo 命令自动加上 --locked。
# ---------------------------------------------------------------------------

# 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快
lint:
  stage: check
  # 用 extends 而不是 YAML 锚点：同一个 mapping 里出现两个 `<<` 是非法 YAML
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just typos-cli taplo-cli
    - just install-rustfmt
    - just lint

# 测试 + 覆盖率
test:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  variables:
    # 用 .config/nextest.toml 里的 ci profile：不 fail-fast、失败重试、输出 JUnit
    NEXTEST_PROFILE: ci
  script:
    - install_tools just cargo-nextest cargo-llvm-cov
    # coverage 配方最后打印的汇总供下面的 coverage 正则提取
    - just coverage doctest
  # 让 GitLab 的 MR 页面直接显示覆盖率百分比
  coverage: '/TOTAL.*?(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - lcov.info
    reports:
      junit: target/nextest/ci/junit.xml

# 依赖审计：不需要编译，几秒出结果
deny:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just cargo-deny
    - just audit

# 特性组合检查：覆盖「只开某一个 feature 编不过」这类问题；没声明 feature 时配方直接跳过
hack:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just cargo-hack
    - just hack

# stable 项目用 Cargo.toml 里声明的 rust-version 编一遍；nightly 项目改用
# `-Zpolonius=off` 换回 stable 的 NLL 借用检查器编一遍。分支判断在 msrv 配方里。
msrv:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just
    - just msrv

# 公开 API 的破坏性变更检查：以上一个 v* tag 为基线，
# 不是纯库项目或还没有 tag 时配方直接跳过
semver:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  variables:
    GIT_DEPTH: 0 # 需要完整历史才能找到上一个 tag
  script:
    - install_tools just cargo-semver-checks
    - just semver

# ---------------------------------------------------------------------------
# 以下只在 v* tag 上跑
# ---------------------------------------------------------------------------

# 把 tag 指向的 commit 从零验证一遍，不带缓存
verify-tag:
  stage: check
  extends: .rust-setup
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - install_tools just cargo-nextest cargo-deny typos-cli taplo-cli
    - just install-rustfmt
    # 与上面的 lint / test / deny 同一套检查，发版这条路径上不能比日常流水线松
    - just ci
    # 校验 tag 名与 Cargo.toml 里的版本一致
    - |
      version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
      if [ "v$version" != "$CI_COMMIT_TAG" ]; then
        echo "tag ($CI_COMMIT_TAG) 与 Cargo.toml 里的版本 (v$version) 不一致"; exit 1
      fi
      echo "版本一致：$CI_COMMIT_TAG"

changelog:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  variables:
    GIT_DEPTH: 0 # git-cliff 需要完整历史才能算出版本区间
    # cliff.toml 按这个变量拼 GitLab 的提交链接，不设的话会退回 GitHub 分支
    GITLAB_REPO: $CI_PROJECT_PATH
  script:
    - install_tools git-cliff
    - git cliff --offline --latest --strip header -o CHANGES.md
  artifacts:
    paths:
      - CHANGES.md

# 编译 Linux 二进制并作为构建产物挂出来。
# 想让它出现在 Release 页面的下载列表里，需要先传到 GitLab 的通用软件包库，
# 再在下面的 release job 里用 assets:links 引用，例如：
#   curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$BIN" \
#     "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$CI_COMMIT_TAG/$PKG"
build-binary:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  script:
    # lib 项目没有可执行文件，跳过，避免 cp 失败连带 release job 不跑
    - |
      if [ ! -f src/main.rs ]; then
        echo "没有 bin target，跳过二进制构建"
        mkdir -p dist && touch dist/.gitkeep
        exit 0
      fi
    - cargo build --release --locked
    - pkg=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
    - mkdir -p dist && cp "target/release/$pkg" dist/
    - (cd dist && sha256sum "$pkg" > "$pkg.sha256")
  artifacts:
    paths:
      - dist/
    expire_in: never

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: changelog
      artifacts: true
    - job: build-binary
      artifacts: true
  # release 关键字由镜像里的 glab 执行（需要 glab 1.58+；release-cli 已弃用）。
  # 镜像钉到版本 tag 而不是 `:latest`，保证发版路径可复现；升级时手工改这一行。
  # 想更严就换成 digest：
  #   registry.gitlab.com/gitlab-org/cli@sha256:79223ad3fa6e3c3226119ac5d0b73e55f1b909e6d5bbf8469726480723b63ba8
  image: registry.gitlab.com/gitlab-org/cli:v1.119.0
  script:
    - echo "creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: CHANGES.md
