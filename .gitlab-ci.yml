# GitLab CI：检查类 job 并行，各自调用 justfile 里的同名配方；
# 打 v* tag 时从零验证一遍，再创建 Release。

stages:
  - check
  - release

default:
  # 工具链版本由 rust-toolchain.toml 决定
  image: rust:1-slim-trixie
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，关掉增量编译
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # 放在工程目录下才能被缓存；不能叫 .cargo（项目级 cargo 配置目录）
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # 不自动清理恢复出来的全局缓存
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never

# 按 job 名区分的两份缓存：安装的工具，以及随 Cargo.lock 变化的依赖与编译产物。
# 以 . 开头的隐藏 job 只供 extends 引用。
.cargo-cache:
  cache:
    - key: cargo-tools-$CI_JOB_NAME-v1
      paths:
        - .cargo-home/bin/
    - key:
        files:
          - Cargo.lock
        prefix: $CI_JOB_NAME
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - .cargo-home/git/db/
        - target/
      policy: pull-push

# 各 job 共用的准备动作。install_tools 跳过缓存里已有的工具，其余用 cargo-binstall 安装
.rust-setup:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
    # 按 rust-toolchain.toml 装好 channel 与 components
    - rustup show active-toolchain || rustup toolchain install
    - rustc --version && cargo --version
    - |
      install_tools() {
        missing=""
        for crate in "$@"; do
          # 包名到二进制名的映射
          case "$crate" in
            typos-cli) bin=typos ;;
            taplo-cli) bin=taplo ;;
            *)         bin="$crate" ;;
          esac
          command -v "$bin" >/dev/null 2>&1 || missing="$missing $crate"
        done
        if [ -z "$missing" ]; then
          echo "所需工具都在缓存里，跳过安装"
          return 0
        fi
        echo "需要安装:$missing"
        # 工具缓存为空时先编译 cargo-binstall
        command -v cargo-binstall >/dev/null 2>&1 || cargo install --locked cargo-binstall
        # shellcheck disable=SC2086
        cargo binstall --no-confirm --locked $missing
      }

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# 下面各 job 调用 justfile 里的同名配方，CI 环境下 cargo 命令自动带 --locked
# ---------------------------------------------------------------------------

# 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快
lint:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just typos-cli taplo-cli
    - just lint

# 测试 + 覆盖率
test:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  variables:
    # 用 .config/nextest.toml 里的 ci profile：不 fail-fast、失败重试、输出 JUnit
    NEXTEST_PROFILE: ci
  script:
    - install_tools just cargo-nextest cargo-llvm-cov
    # coverage 配方最后打印的汇总供下面的 coverage 正则提取
    - just coverage doctest
  # 让 GitLab 的 MR 页面直接显示覆盖率百分比
  coverage: '/TOTAL.*?(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - lcov.info
    reports:
      junit: target/nextest/ci/junit.xml

# 依赖审计：不需要编译，几秒出结果
deny:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just cargo-deny
    - just audit

# 逐个检查 feature 组合，没声明 feature 时跳过
hack:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just cargo-hack
    - just hack

# stable 项目按 rust-version 编译，nightly 项目改用 NLL 借用检查器编译
msrv:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just
    - just msrv

# 纯库项目：以上一个 v* tag 为基线检查公开 API 的破坏性变更
semver:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  variables:
    GIT_DEPTH: 0 # 需要完整历史才能找到上一个 tag
  script:
    - install_tools just cargo-semver-checks
    - just semver

# 纯库项目：直接依赖取约束允许的最低版本编译 lib
minimal-versions:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools just
    - just minimal-versions

# ---------------------------------------------------------------------------
# 以下只在 v* tag 上跑
# ---------------------------------------------------------------------------

# 从零验证 tag 指向的 commit，不带缓存
verify-tag:
  stage: check
  extends: .rust-setup
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - install_tools just cargo-nextest cargo-deny typos-cli taplo-cli
    - just ci
    # tag 与 Cargo.toml 的版本一致
    - |
      version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
      if [ "v$version" != "$CI_COMMIT_TAG" ]; then
        echo "tag ($CI_COMMIT_TAG) 与 Cargo.toml 里的版本 (v$version) 不一致"; exit 1
      fi
      echo "版本一致：$CI_COMMIT_TAG"

changelog:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  variables:
    GIT_DEPTH: 0 # git-cliff 需要完整历史才能算出版本区间
    # cliff.toml 据此拼 GitLab 的提交链接
    GITLAB_REPO: $CI_PROJECT_PATH
  script:
    - install_tools git-cliff
    - git cliff --offline --latest --strip header -o CHANGES.md
  artifacts:
    paths:
      - CHANGES.md

# 编译 Linux 二进制并挂成 job 产物。要在 Release 页面提供下载，先传到通用软件包库，
# 再在 release job 里用 assets:links 引用：
#   curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$BIN" \
#     "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$CI_COMMIT_TAG/$PKG"
build-binary:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  script:
    # lib 项目没有二进制，只留一个空的 dist/
    - |
      if [ ! -f src/main.rs ]; then
        echo "没有 bin target，跳过二进制构建"
        mkdir -p dist && touch dist/.gitkeep
        exit 0
      fi
    - cargo build --release --locked
    - pkg=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
    - mkdir -p dist && cp "target/release/$pkg" dist/
    - (cd dist && sha256sum "$pkg" > "$pkg.sha256")
  artifacts:
    paths:
      - dist/
    expire_in: never

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: changelog
      artifacts: true
    - job: build-binary
      artifacts: true
  # release 关键字由镜像里的 glab 执行（需要 1.58+），版本需手工升级
  image: registry.gitlab.com/gitlab-org/cli:v1.119.0
  script:
    - echo "creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: CHANGES.md
