# GitLab CI —— 与 .github/workflows/ 等价的一套流水线。
# 生成项目时选 `ci = gitlab` 才会保留本文件（选 github 则保留 .github/）。
#
# 结构：lint / test / deny / hack / semver 并行，msrv 视工具链走 MSRV / NLL 两条路之一，
#       打 v* tag 时额外跑 release（先从零验证一遍，再建 Release）。

stages:
  - check
  - release

default:
  # 官方 rust 镜像作底，真正的版本由仓库里的 rust-toolchain.toml 决定。
  # trixie = Debian 13。
  image: rust:1-slim-trixie
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  CARGO_TERM_COLOR: always
  # CI 是一次性环境，关掉增量编译
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # GitLab 只能缓存工程目录下的路径，所以把 CARGO_HOME 挪进来。
  # 不叫 `.cargo`：那是项目级 cargo 配置目录的名字，会被缓存覆盖掉。
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # 关掉 cargo 的全局缓存自动 GC，避免它把刚恢复的缓存内容删掉
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  GIT_SUBMODULE_STRATEGY: recursive

# 两份缓存，key 不同，互不牵连：
#   - 工具（cargo-nextest 等）几乎不变，用固定 key；
#   - 编译产物跟着 Cargo.lock 走。
#
# 以 `.` 开头的是 GitLab 的隐藏 job，只作模板用，不会被调度执行。
.cargo-cache:
  cache:
    - key: cargo-tools-v1
      paths:
        - .cargo-home/bin/
    - key:
        files:
          - Cargo.lock
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - .cargo-home/git/db/
        - target/
      policy: pull-push

# 各 job 共用的准备动作，其中 install_tools 的策略是
# 「缓存里有就跳过，没有就用 cargo-binstall 下预编译二进制」。
.rust-setup:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - export PATH="$CARGO_HOME/bin:$PATH"
    # 按 rust-toolchain.toml 装好 channel 与 components
    - rustup show active-toolchain || rustup toolchain install
    - rustc --version && cargo --version
    - |
      install_tools() {
        missing=""
        for crate in "$@"; do
          # 少数 crate 的二进制名和包名不一致，这里做个映射
          case "$crate" in
            typos-cli) bin=typos ;;
            taplo-cli) bin=taplo ;;
            *)         bin="$crate" ;;
          esac
          command -v "$bin" >/dev/null 2>&1 || missing="$missing $crate"
        done
        if [ -z "$missing" ]; then
          echo "所需工具都在缓存里，跳过安装"
          return 0
        fi
        echo "需要安装:$missing"
        # cargo-binstall 只在第一条流水线上编译一次，之后从 .cargo-home/bin 缓存里来
        command -v cargo-binstall >/dev/null 2>&1 || cargo install --locked cargo-binstall
        # shellcheck disable=SC2086
        cargo binstall --no-confirm --locked $missing
      }

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# 格式化 / 拼写 / clippy / 文档：不跑测试，失败得最快
# ---------------------------------------------------------------------------
lint:
  stage: check
  # 用 extends 而不是 YAML 锚点：同一个 mapping 里出现两个 `<<` 是非法 YAML
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    # 按 rust-toolchain.toml 的 channel 推导格式化工具链，规则与 justfile 的
    # fmt_toolchain 变量一致（rustfmt.toml 用了 unstable 选项，必须走 nightly 的 rustfmt）。
    - |
      channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
      case "$channel" in
        # channel 本身是 nightly（含日期版本）：components 里已经带了 rustfmt
        nightly*)
          FMT_TOOLCHAIN="$channel"
          ;;
        # stable / 具体版本号：额外装一份 nightly 的 rustfmt，
        # --allow-downgrade 让 rustup 在当天缺组件时自动退回
        *)
          FMT_TOOLCHAIN=nightly
          rustup toolchain install nightly --allow-downgrade --profile minimal --component rustfmt
          ;;
      esac
    - install_tools typos-cli taplo-cli
    - cargo "+$FMT_TOOLCHAIN" fmt --all -- --check
    # rustfmt 不管 .toml，TOML 排版由 taplo 保证（规则见 .taplo.toml）
    - taplo fmt --check
    - typos
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features --document-private-items

# ---------------------------------------------------------------------------
# 测试 + 覆盖率
# ---------------------------------------------------------------------------
test:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools cargo-nextest cargo-llvm-cov
    # 这里没有单独的 `cargo check`：lint job 的 clippy 已是它的超集。
    # 分两步：先只跑测试收集数据（--no-report），再从同一份数据出两种报告。
    - cargo llvm-cov --no-report nextest --locked --profile ci --all-features
    - cargo llvm-cov report --lcov --output-path lcov.info
    - cargo llvm-cov report --summary-only
    # nextest 不跑 doctest，有 lib target 时补一次
    - if [ -f src/lib.rs ]; then cargo test --locked --doc --all-features; fi
  # 让 GitLab 的 MR 页面直接显示覆盖率百分比
  coverage: '/TOTAL.*?(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - lcov.info
    reports:
      junit: target/nextest/ci/junit.xml

# ---------------------------------------------------------------------------
# 依赖审计：不需要编译，几秒出结果
# ---------------------------------------------------------------------------
deny:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools cargo-deny
    - cargo deny check -A unmatched-bypass

# ---------------------------------------------------------------------------
# 特性组合检查：覆盖「只开某一个 feature 编不过」这类问题
# ---------------------------------------------------------------------------
hack:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - install_tools cargo-hack
    - cargo hack --locked --feature-powerset --depth 2 --no-dev-deps check

# ---------------------------------------------------------------------------
# 按 rust-toolchain.toml 的 channel 分两条路（与 GitHub 那套 build.yaml 的 msrv job 一致）：
#   stable  → 验证 Cargo.toml 里声明的最低版本真的能编译
#   nightly → MSRV 检查不适用，改用 `-Zpolonius=off` 把借用检查器换回 stable 的 NLL，
#             拦下只有 nightly 编得过的代码
# ---------------------------------------------------------------------------
msrv:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  script:
    - |
      channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
      version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)
      if [ "${channel#nightly}" != "$channel" ]; then
        echo "工具链是 ${channel}：MSRV 检查不适用，改跑 NLL 兜底检查"
        # 换个 target 目录，避免和其它 job 共用的 target/ 互相顶掉；
        # RUSTFLAGS 整体覆盖 .cargo/config.toml 里的 rustflags，在那边加参数时要同步这里。
        export CARGO_TARGET_DIR=target/nll
        RUSTFLAGS=-Zpolonius=off cargo check --locked --all-targets --all-features
        exit 0
      fi
      if [ -z "$version" ]; then
        echo "Cargo.toml 里没有 rust-version，跳过 MSRV 检查"; exit 0
      fi
      echo "MSRV = $version"
      rustup toolchain install "$version" --profile minimal
      cargo "+$version" check --locked --all-targets --all-features

# ---------------------------------------------------------------------------
# 公开 API 的破坏性变更检查（与 GitHub 那套的 semver job 对齐）。
# 以上一个 v* tag 为基线，指出该抬 minor 还是 major；没有 tag 时自动跳过。
# 判断条件是「有 src/lib.rs 且没有 src/main.rs」：bin 项目的 lib target 是内部库，
# 不参与检查；要同时对外发布库和命令行时，把 main.rs 那半条删掉。
# ---------------------------------------------------------------------------
semver:
  stage: check
  extends:
    - .cargo-cache
    - .rust-setup
  variables:
    GIT_DEPTH: 0 # 需要完整历史才能找到上一个 tag
  script:
    - |
      if [ ! -f src/lib.rs ] || [ -f src/main.rs ]; then
        echo "不是纯库项目，跳过 semver 检查"; exit 0
      fi
      if ! tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
        echo "仓库还没有 v* tag，跳过 semver 检查"; exit 0
      fi
      echo "基线版本：$tag"
      install_tools cargo-semver-checks
      cargo semver-checks --baseline-rev "$tag"

# ---------------------------------------------------------------------------
# 以下只在 v* tag 上跑
# ---------------------------------------------------------------------------

# 把 tag 指向的 commit 从零验证一遍，不带缓存
verify-tag:
  stage: check
  extends: .rust-setup
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - install_tools cargo-nextest cargo-deny
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo nextest run --locked --all-targets --all-features
    - if [ -f src/lib.rs ]; then cargo test --locked --doc --all-features; fi
    - cargo deny check -A unmatched-bypass
    # 校验 tag 名与 Cargo.toml 里的版本一致
    - |
      version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
      if [ "v$version" != "$CI_COMMIT_TAG" ]; then
        echo "tag ($CI_COMMIT_TAG) 与 Cargo.toml 里的版本 (v$version) 不一致"; exit 1
      fi
      echo "版本一致：$CI_COMMIT_TAG"

changelog:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  variables:
    GIT_DEPTH: 0 # git-cliff 需要完整历史才能算出版本区间
    # cliff.toml 按这个变量拼 GitLab 的提交链接，不设的话会退回 GitHub 分支
    GITLAB_REPO: $CI_PROJECT_PATH
  script:
    - install_tools git-cliff
    - git cliff --offline --latest --strip header -o CHANGES.md
  artifacts:
    paths:
      - CHANGES.md

# 编译 Linux 二进制并作为构建产物挂出来。
# 想让它出现在 Release 页面的下载列表里，需要先传到 GitLab 的通用软件包库，
# 再在下面的 release job 里用 assets:links 引用，例如：
#   curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$BIN" \
#     "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG/$CI_COMMIT_TAG/$PKG"
build-binary:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  extends: .rust-setup
  needs: [verify-tag]
  script:
    # lib 项目没有可执行文件，跳过，避免 cp 失败连带 release job 不跑
    - |
      if [ ! -f src/main.rs ]; then
        echo "没有 bin target，跳过二进制构建"
        mkdir -p dist && touch dist/.gitkeep
        exit 0
      fi
    - cargo build --release --locked
    - pkg=$(grep -m1 '^name' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
    - mkdir -p dist && cp "target/release/$pkg" dist/
    - (cd dist && sha256sum "$pkg" > "$pkg.sha256")
  artifacts:
    paths:
      - dist/
    expire_in: never

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: changelog
      artifacts: true
    - job: build-binary
      artifacts: true
  # 镜像钉到版本 tag 而不是 `:latest`，保证发版路径可复现；升级时手工改这一行。
  # 想更严就换成 digest：
  #   registry.gitlab.com/gitlab-org/release-cli@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  script:
    - echo "creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: CHANGES.md
