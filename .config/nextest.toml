# cargo-nextest 配置：https://nexte.st/docs/configuration/
#   本地：just test                           （default profile）
#   CI  ：NEXTEST_PROFILE=ci just coverage    （ci profile）
#
# 只写与默认值不同的项，默认值见
# https://github.com/nextest-rs/nextest/blob/main/nextest-runner/default-config.toml

# 低于这个版本直接报错（退出码 92）；global-timeout 需要 0.9.100+
nextest-version = "0.9.100"

[profile.default]
# 超过 30s 的测试标记为 slow；连续 4 个周期（2 分钟）还没结束就判定卡死并杀掉
slow-timeout = { period = "30s", terminate-after = 4 }
# 默认跑全部测试，可按 profile 分别过滤（语法见 https://nexte.st/docs/filtersets/）：
# default-filter = "not test(/^slow_/)"
# `cargo nextest bench` 的超时，默认都是 30 年：
# bench.slow-timeout = { period = "5m" }
# bench.global-timeout = "30m"

# CI 专用 profile，默认继承 default，这里只写与 default 不同的项
[profile.ci]
# 用少量重试吸收 CI 上的偶发抖动，重试后通过的测试标记为 flaky 并单独列出
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }
# 重试后才通过的测试也判失败（默认 "pass"，需要 nextest 0.9.131+）
# flaky-result = "fail"
# 一次跑完，看到全部失败
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
slow-timeout = { period = "60s", terminate-after = 3 }
# 整轮测试的总闸，设得比 CI job 的 timeout-minutes 小一截，让 nextest 先超时并正常收尾
global-timeout = "20m"

# 输出 JUnit 报告（target/nextest/ci/junit.xml），默认只带失败测试的输出
[profile.ci.junit]
path = "junit.xml"
# 跳过的测试也写进报告：ignored（只写 #[ignore] 那批）/ all，需要 nextest 0.9.143+
# report-skipped = "ignored"

# ---------------------------------------------------------------------------
# 测试分组：给共享资源（数据库、固定端口、同一个文件）的测试限制并发。
# 声明一个并发上限为 1 的组，再按名字把相关测试划进去，取消注释即可用。
# ---------------------------------------------------------------------------

# [test-groups.serial]
# max-threads = 1

# [[profile.default.overrides]]
# filter = 'test(/^db::/)'
# test-group = 'serial'

# 单独给个别慢测试放宽超时，而不动全局 slow-timeout
# [[profile.default.overrides]]
# filter = 'test(integration)'
# slow-timeout = { period = "120s", terminate-after = 2 }

# 本文件没用到的能力：跑测试前执行命令（setup scripts）、给测试进程套外壳（wrapper scripts），
# 见 https://nexte.st/docs/configuration/setup-scripts/ 与 .../wrapper-scripts/
