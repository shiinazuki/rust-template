# 生成的项目默认自成一个 workspace root。
# 这样即使把项目放进别的 workspace 目录下，也不会被父级 workspace 意外接管
# （否则 cargo 会报 "current package believes it's in a workspace when it's not"）。
[workspace]
# 现在只有根 crate 一个成员。以后拆分子 crate（比如 crates/core、crates/cli）时
# 在这里登记，下面 [workspace.package] / [workspace.dependencies] / [workspace.lints]
# 里的配置它们可以直接继承，不必每个子 crate 抄一遍。
members = []
resolver = "3"

# --- 供所有成员继承的公共元数据 -------------------------------------------
# 子 crate 里写 `version.workspace = true` 即可继承，发版时只改这一处。
[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV（最低支持版本）。它只是下限，不限制上限——用更新的 stable 或 nightly 编译都没问题。
# 作用：低于它时 cargo 直接报错；resolver 选依赖版本时会避开要求更高 rustc 的版本；
# clippy 也会读它，不建议你用比 MSRV 更新的 API。
# `just msrv` 和 CI 的 msrv job 会验证它属实；nightly 项目会自动跳过该检查。
rust-version = "1.85"
license = "{{ license }}"
# 域名按 ci 选项推导，不要写死 github.com——这个字段会跟着 `cargo publish` 进 crates.io，
# 指错了就是一个所有人都点得到的 404。ci = none 时按 github 处理，需要的话手工改。
repository = "https://{% if ci == 'gitlab' %}gitlab.com{% else %}github.com{% endif %}/{{ repo-owner }}/{{ project-name }}"
authors = ["{{ authors }}"]

# --- 供所有成员继承的依赖版本 ---------------------------------------------
# 版本号统一在这里定，成员里只写 `foo = { workspace = true }`，
# 避免多个子 crate 各自声明版本导致同一个库被编进来两份。
#
# ⚠️ 下面用的是「注释锚定」写法：模板里的条件标签一律挂在 TOML 注释行的**行尾**，
#    于是模板仓库里的这个文件**同时也是合法 TOML**——编辑器的 TOML 语言服务
#    （taplo / even-better-toml）不会把两个标签行当成重复键而报
#    "Duplicate dependency name"，`check-toml` 钩子与 `taplo fmt` 也能照常工作。
#    反例：让标签单独占一行，文件就成了非法 TOML。
#    （标签在生成时已经消失，这段说明留着只是为了解释下面这种排版从何而来；
#      完整说明见模板仓库 README 的「TOML 文件里的 liquid 标签必须锚在注释行」。）
[workspace.dependencies]
# 这里是版本目录：成员写 `foo = { workspace = true }` 引用后才真正生效{% if async_runtime %}
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# tokio 的 feature 在此统一收口，子 crate 不要各自再开{% endif %}{% if cli and crate_type == "bin" %}
clap = { version = "4", features = ["derive", "env"] }
# derive = 用结构体声明参数；env = 允许 #[arg(env = "...")] 回落到环境变量（容器里的常规做法）{% endif %}{% if logging and crate_type == "bin" %}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# env-filter 提供 RUST_LOG 那套运行时可调的过滤语法，不用重新编译就能改日志级别{% endif %}{% if error_handling %}
thiserror = "2"
# thiserror 只在编译期展开成 impl，不会给运行时增加负担{% endif %}{% if error_handling and crate_type == "bin" %}
anyhow = "1"
# anyhow 只给应用层用；库对外暴露它等于剥夺了调用方分类处理错误的能力，见 src/error.rs{% endif %}

[package]
name = "{{ project-name }}"
description = "{{ description }}"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# keywords = ["cli"]                        # 最多 5 个，发布到 crates.io 时用于搜索
# categories = ["command-line-utilities"]   # 取值见 https://crates.io/categories
# publish = false                           # 内部项目建议打开，防止误发布到 crates.io

# 打包发布时排除掉只对开发有意义的文件，减小 .crate 体积
exclude = [
  ".github/",
  ".gitlab/",
  ".gitlab-ci.yml",
  ".vscode/",
  ".config/",
  ".pre-commit-config.yaml",
  ".gitattributes",
  ".dockerignore",
  "Dockerfile",
  "cliff.toml",
  "deny.toml",
  "justfile",
  "docker.just",
  "bacon.toml",
  "release.toml",
  ".devcontainer/",
  ".editorconfig",
  ".taplo.toml",
  ".typos.toml",
  "rust-toolchain.toml",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "CODEOWNERS",
]

# docs.rs 元数据只有库项目才生成——bin 不会发布到 docs.rs。{% if crate_type == "lib" %}
# 用全部 feature 构建文档，否则藏在 optional feature 后面的 API 在线文档里根本看不到；
# --cfg docsrs 则允许你用 #[cfg_attr(docsrs, doc(cfg(...)))] 标注
# 「这个 API 需要开哪个 feature」。
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
# 以上仅 lib{% endif %}

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# ---------------------------------------------------------------------------
# Feature 开关
#
# 现在一个都没声明，于是 CI 的 hack job（cargo hack --feature-powerset）等价于
# 一次普通 check。等你把下面这段的注释去掉，它才真正开始发挥作用——不用改 CI。
#
# 为什么值得从第一天就把这个位置留出来：使用者可能只开其中一个 feature，
# 而你本地永远跑的是 --all-features，「单独开 A 编不过」这类问题只有幂集检查能发现。
# ---------------------------------------------------------------------------
# [features]
# default = []
# # optional = true 的依赖会自动生成一个同名 feature；想改名字用 dep: 前缀显式转发：
# # serde = ["dep:serde", "dep:serde_json"]

[dependencies]
# 版本继承自上面的 [workspace.dependencies]，这里只声明「本 crate 要用」{% if async_runtime and crate_type == "bin" %}
tokio = { workspace = true }
# 入口是 #[tokio::main]，见 src/main.rs{% endif %}{% if cli and crate_type == "bin" %}
clap = { workspace = true }
# 参数定义见 src/cli.rs{% endif %}{% if logging and crate_type == "bin" %}
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 初始化见 src/telemetry.rs{% endif %}{% if error_handling %}
thiserror = { workspace = true }
# 领域错误类型见 src/error.rs{% endif %}{% if error_handling and crate_type == "bin" %}
anyhow = { workspace = true }
# main 用它收口，配合 .context() 补充上下文{% endif %}

# 只在测试 / benchmark / example 里用到的依赖放这里，不会进使用者的依赖树。
# 默认留空——测试辅助库按项目需要选，预置一堆没人用的反而是负担。常用的几个：
#
#   assert_cmd + predicates   跑真实的可执行文件，断言退出码 / stdout / stderr
#   trycmd                    把 CLI 的输入输出写成 .md 快照，改一行就能重跑对齐
#   insta                     快照测试，`cargo insta review` 交互式确认差异
#   rstest                    参数化测试，一个函数跑多组输入
#   proptest                  性质测试，自动找反例并收缩到最小复现
#   tempfile                  临时目录 / 文件，测试结束自动清理
#   pretty_assertions         断言失败时给彩色 diff，而不是两大坨 Debug 输出
#   divan / criterion         benchmark（配合 benches/ 与 [profile.bench]）
[dev-dependencies]
# tokio 只在「库 + async」这一种组合下出现在这里：库那一侧只有 #[tokio::test] 用得到它，
# 放进 [dependencies] 等于让每个使用者都白拉一份。bin 项目的 tokio 在上面那一段——
# 它的 #[tokio::main] 是真的运行时依赖。{% if async_runtime and crate_type == "lib" %}
tokio = { workspace = true }
# 要在库里跑异步逻辑时再把它挪回 [dependencies]；但不要在库里装 runtime，
# 起不起 runtime 是应用的决定{% endif %}

# `just unused` 用 cargo-machete 找出声明了却没用到的依赖。它靠扫源码里的符号判断，
# 只在宏展开里用到的依赖会被误报，在这里逐个放行：
# [package.metadata.cargo-machete]
# ignored = ["some-crate"]

# ---------------------------------------------------------------------------
# 编译配置
# ---------------------------------------------------------------------------

# 依赖用 O2 编译、自身代码保持 O0：调试体验不变，但依赖里的热点代码（解析、
# 加解密、序列化等）在 debug 运行时快一个数量级。代价是首次编译稍慢。
[profile.dev.package."*"]
opt-level = 2
# 依赖的调试符号基本用不上，去掉能显著缩小 target/ 并加快链接
debug = false

[profile.dev]
# macOS / Linux 上把调试信息留在 .o 里而不是打包进二进制，链接快很多。
# Windows 上 cargo 会自动忽略这一项。
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin" # 需要更激进可改成 "fat"，体积更小但编译明显变慢
codegen-units = 1
strip = "symbols"
panic = "unwind" # 改成 "abort" 二进制更小，但会禁用 unwind 并影响 #[should_panic] 测试

# 做性能分析（flamegraph / samply / instruments）时用：
#   cargo build --profile profiling
# 优化级别与 release 一致，但保留符号，火焰图才有可读的函数名。
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# benchmark 跟着 release 的优化走，否则测出来的是 O0 的数字，没有参考价值
[profile.bench]
inherits = "release"
debug = true
strip = "none"

# 测试用 O1：比 O0 跑得快不少，又不像 O3 那样每次都要等半天编译
[profile.test]
opt-level = 1

# 下面两项默认注释着，按项目性质决定要不要打开：
#
# [profile.dev.build-override]
# build script 与 proc-macro（serde_derive 这类）是用这一段编译的，
# 上面的 [profile.dev.package."*"] 管不到它们。derive 用得多时打开会更快。
# opt-level = 1
#
# [profile.release]
# overflow-checks = true
# release 默认关闭整数溢出检查，溢出会静默回绕。对账务 / 计费 / 协议解析这类
# 场景，宁可 panic 也不要算错——打开它的代价通常在噪声范围内。

# ---------------------------------------------------------------------------
# 统一代码规范与 Clippy 约束
#
# 放在 [workspace.lints] 而不是 [lints]，将来加子 crate 时它们只需写
# `[lints] workspace = true` 就能继承同一套规则，不会各自漂移。
#
# 注意 lint 组（group）必须带 priority = -1，否则组会覆盖掉后面单条 lint 的设置。
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "forbid" # 默认禁止 unsafe（确实需要时改成 "deny" 并按处 allow）
missing_debug_implementations = "warn"
unreachable_pub = "warn" # 只在 crate 内部用的类型不要暴露成 pub
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# 未来版本里会变成硬错误的用法，趁现在还只是 warning 就改掉
future_incompatible = { level = "warn", priority = -1 }
# `let _ = mutex.lock()` 这类「守卫当场被丢弃」的坑：编译器不拦，这条拦
let_underscore_drop = "warn"
unused_lifetimes = "warn"
# 库项目自动打开：强制公开 API 写文档注释（二进制项目生成为 "allow"）
missing_docs = "{% if crate_type == 'lib' %}warn{% else %}allow{% endif %}"
# 下面这条配套上面的 [package.metadata.docs.rs]，只对库项目生成{% if crate_type == "lib" %}
# 自 1.80 起 cargo 会校验 cfg 名字：docsrs 不登记在这里的话，一旦按 docs.rs 那段的建议
# 写 #[cfg_attr(docsrs, doc(cfg(...)))]，本地 cargo check 就会报 unexpected_cfgs，
# 而 CI 是 -D warnings ——一条纯粹为了文档写的属性会把构建打红。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
# 以上仅 lib{% endif %}

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# 手动加严：这几条 clippy 默认不开，但线上事故多半出在这里
enum_glob_use = "deny"
unwrap_used = "warn" # 不要随手 unwrap，改用 ? 或 expect("说明为什么不会失败")
dbg_macro = "warn" # 调试用的 dbg! 不要带进提交
todo = "warn"
mem_forget = "deny"
# 统一模块布局：用 foo.rs + foo/ 而不是 foo/mod.rs，免得一个仓库里两种风格混着来
self_named_module_files = "warn"
# 已经是 &str 还 .to_string()：写 .to_owned() 意图更清楚，也少一次格式化机器的开销
str_to_string = "warn"
# 只是想读一个文件却手写 File::open + read_to_string 的绕远路写法
verbose_file_reads = "warn"

# 降噪：pedantic 里在业务代码中收益不高的几条。按需删掉即可恢复检查。
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# 测试里用 unwrap/expect/panic 是常态，由 clippy.toml 的 allow-*-in-tests 统一放行，
# 不需要再在源码里写 #![cfg_attr(test, allow(clippy::unwrap_used))]。

# 文档里的死链是最容易悄悄积累的技术债：写的时候不报错，等有人点开文档才发现。
# CI 靠 RUSTDOCFLAGS="-D warnings" 兜底，但声明在这里，本地 `cargo doc`
# 和编辑器里同样生效。
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_html_tags = "warn"
bare_urls = "warn"

# 根 crate 继承上面那套规则
[lints]
workspace = true
