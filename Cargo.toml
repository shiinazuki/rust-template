[package]
name = "rust_template"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]


# 统一代码规范与 Clippy 约束
[lints.rust]
unsafe_code = "forbid"                 # 默认禁止 unsafe（根据项目实际情况调整）
missing_debug_implementations = "warn"

[lints.clippy]
enum_glob_use = "deny"
unwrap_used = "warn"                         # 提示不要随手 unwrap，改用 ? 或 expect
pedantic = { level = "warn", priority = -1 }
