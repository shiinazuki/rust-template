# taplo 的 TOML 格式化配置，`just fmt` 格式化、`just lint` 检查，编辑器的 even-better-toml 也读它
# 选项见 https://taplo.tamasfe.dev/configuration/formatter-options.html

# 不格式化的目录。taplo 不读 .gitignore；.cargo-home 是 GitLab CI 的 CARGO_HOME
exclude = ["target/**", ".cargo-home/**"]

[formatting]
# 不对齐行尾注释与键值（CJK 字符的宽度会算错）
align_comments = false
align_entries = false
column_width = 100
